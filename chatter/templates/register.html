<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · syh's chatter</title>
    <link rel="shortcut icon" href="static/icon.png" type="image/x-icon">
    <style>
        /* ========== 扁平主题变量 ========== */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --fg-primary: #e0e0e0;
            --fg-secondary: #999999;
            --fg-muted: #666666;
            --border-color: #3a3a3a;
            --border-focus: #e0e0e0;
            --accent: #ffffff;
            --accent-hover-text: #1a1a1a;
            --font-mono: 'Jetbrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
            --transition-speed: 0.2s;
            --glow-text-1: #ffffff;
            --glow-text-2: #999999;
        }

        body.light-theme {
            --bg-primary: #fafafa;
            --bg-secondary: #f0f0f0;
            --fg-primary: #1a1a1a;
            --fg-secondary: #555555;
            --fg-muted: #999999;
            --border-color: #cccccc;
            --border-focus: #1a1a1a;
            --accent: #1a1a1a;
            --accent-hover-text: #ffffff;
            --glow-text-1: #1a1a1a;
            --glow-text-2: #666666;
        }

        @font-face {
            font-family: 'Jetbrains Mono';
            src: url('static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== 主题切换按钮 - 纯文字版 ========== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 100;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--fg-secondary);
            padding: 10px 18px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            transition: all var(--transition-speed);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover {
            color: var(--fg-primary);
            border-color: var(--fg-primary);
        }
        .theme-toggle .mode-text {
            display: inline-block;
            min-width: 2.5em;
            text-align: center;
            transition: color 0.3s;
            animation: textPulse 2s infinite;
        }
        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 主容器 ========== */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 0 2rem;
            text-align: center;
        }

        /* ========== 品牌标识 - 动态文字 ========== */
        .brand {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--fg-muted);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 20px;
        }
        .brand .dash {
            display: inline-block;
            width: 20px;
            height: 1px;
            background: var(--border-color);
            transition: background var(--transition-speed);
        }
        .dynamic-word {
            display: inline-block;
            position: relative;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--glow-text-1);
        }
        .dynamic-word span {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            white-space: nowrap;
            animation: wordCycle 4s infinite;
            opacity: 0;
        }
        .dynamic-word span:nth-child(1) {
            animation-delay: 0s;
        }
        .dynamic-word span:nth-child(2) {
            animation-delay: 2s;
        }
        @keyframes wordCycle {
            0%,
            35% {
                opacity: 0;
                transform: translateY(5px);
            }
            40%,
            60% {
                opacity: 1;
                transform: translateY(0);
            }
            65%,
            100% {
                opacity: 0;
                transform: translateY(-5px);
            }
        }

        /* ========== 标题区 ========== */
        .login-title {
            margin-bottom: 3rem;
        }
        .login-title h1 {
            font-size: 2.4rem;
            letter-spacing: 6px;
            font-weight: 400;
            color: var(--fg-primary);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }
        .login-title .divider {
            display: block;
            width: 40px;
            height: 2px;
            background: var(--border-color);
            margin: 0 auto 1rem;
            transition: background var(--transition-speed);
        }
        .login-title p {
            color: var(--fg-muted);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ========== 表单控件 ========== */
        .form-control {
            position: relative;
            margin: 2rem 0;
            text-align: left;
        }
        .form-control input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            padding: 14px 4px 10px;
            font-size: 1rem;
            color: var(--fg-primary);
            font-family: var(--font-mono);
            letter-spacing: 1px;
            outline: none;
            transition: border-color var(--transition-speed);
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .form-control input:focus {
            border-bottom-color: var(--border-focus);
        }
        .form-control input::placeholder {
            color: transparent;
        }
        .form-control label {
            position: absolute;
            left: 4px;
            top: 14px;
            color: var(--fg-muted);
            pointer-events: none;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-control input:focus~label,
        .form-control input:not(:placeholder-shown)~label {
            transform: translateY(-26px);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--fg-secondary);
        }

        /* ========== 提交按钮 ========== */
        button[type="submit"] {
            width: 100%;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--fg-primary);
            padding: 14px 24px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all var(--transition-speed);
            margin-top: 2.5rem;
            text-transform: uppercase;
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        button[type="submit"]:hover {
            background: var(--accent);
            color: var(--accent-hover-text);
            border-color: var(--accent);
        }
        button[type="submit"]:active {
            transform: scale(0.98);
            transition: transform 0.08s;
        }

        /* ========== 底部信息 ========== */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: var(--fg-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .footer-note .dot-sep {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--border-color);
            margin: 0 8px;
            vertical-align: middle;
            transition: background var(--transition-speed);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 0 1.5rem;
                max-width: 100%;
            }
            .login-title h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            button[type="submit"] {
                letter-spacing: 2px;
                font-size: 0.8rem;
            }
            .dynamic-word {
                min-width: 60px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    {% include '_icons.html' %}
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="mode-text" id="modeIndicator">暗</span> <span>主题</span>
    </button>

    <div class="login-container">
        <div class="brand">
            <span class="dash"></span>
            <span class="dynamic-word">
                <span>JOIN</span>
                <span>REGISTER</span>
            </span>
            <span class="dash"></span>
        </div>

        <div class="login-title">
            <h1>注册</h1>
            <span class="divider"></span>
            <p>使用邀请码加入</p>
        </div>

        {% if error %}
            <div style="color: #ff6b6b; font-size: 0.85rem; margin-bottom: 1.5rem; letter-spacing: 1px; border: 1px solid #ff6b6b; padding: 10px; background: rgba(255, 107, 107, 0.08);">
                <svg class="icon" aria-hidden="true" style="vertical-align:-2px;"><use href="#i-alert"/></svg> {{ error }}
            </div>
        {% endif %}

        <form action="{{ base_path }}/register" method="POST" autocomplete="off">
            <div class="form-control">
                <input type="text" required name="username" id="username" placeholder=" " autocomplete="off">
                <label for="username">Username</label>
            </div>
            <div class="form-control">
                <input type="password" required name="password" id="password" placeholder=" " autocomplete="off">
                <label for="password">Password</label>
            </div>
            <!-- 头像颜色选择 -->
            <div class="form-control" style="margin-top: 1.5rem;">
                <input type="color" name="color" id="color" value="#808080"
                       style="width:100%; height:44px; border: 2px solid var(--border-color); background: transparent; padding: 2px; cursor: pointer; border-radius: 0;">
                <label for="color" style="top: 10px;">头像颜色</label>
            </div>
            <div class="form-control">
                <input type="text" required name="invite_code" id="invite_code" placeholder=" " autocomplete="off">
                <label for="invite_code">邀请码</label>
            </div>
            <button type="submit">// 注册 //</button>
        </form>

        <div class="footer-note" style="margin-top: 2rem;">
            <span>已有账号？</span>
            <a href="{{ base_path }}/sec" style="color: var(--fg-muted); text-decoration: none; border-bottom: 1px solid var(--border-color); padding-bottom: 2px;">
                返回登录
            </a>
        </div>
    </div>

    <script>
        // 主题切换脚本（与 login.html 完全相同）
        const themeToggle = document.getElementById('themeToggle');
        const modeIndicator = document.getElementById('modeIndicator');
        function setThemeUI(isLight) {
            if (isLight) {
                document.body.classList.add('light-theme');
                modeIndicator.textContent = '亮';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                modeIndicator.textContent = '暗';
                localStorage.setItem('theme', 'dark');
            }
        }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') setThemeUI(true);
        else setThemeUI(false);
        themeToggle.addEventListener('click', () => {
            const isLight = !document.body.classList.contains('light-theme');
            setThemeUI(isLight);
        });
    </script>
</body>
</html>
