{# 管理面板内容片段（聊天室弹窗与独立页共用，交互逻辑见 static/js/admin.js） #}
<div class="admin-panel-root">
    <div class="admin-shell">
        <nav class="admin-nav" aria-label="管理导航">
            <button type="button" class="admin-tab active" data-tab="users" title="用户"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></button>
            <button type="button" class="admin-tab" data-tab="groups" title="权限组"><svg class="icon" aria-hidden="true"><use href="#i-puzzle"/></svg></button>
            <button type="button" class="admin-tab" data-tab="plugins" title="插件"><svg class="icon" aria-hidden="true"><use href="#i-power"/></svg></button>
            <button type="button" class="admin-tab" data-tab="traffic" title="流量"><svg class="icon" aria-hidden="true"><use href="#i-bar-chart"/></svg></button>
            <button type="button" class="admin-tab" data-tab="database" title="数据库"><svg class="icon" aria-hidden="true"><use href="#i-database"/></svg></button>
            <button type="button" class="admin-tab" data-tab="settings" title="设置"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg></button>
            <button type="button" class="admin-tab" data-tab="tools" title="快捷工具"><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg></button>
        </nav>
        <div class="admin-main">
            <div class="admin-toast" id="adminToast" hidden></div>
            <div class="admin-tab-pages">
                <div class="admin-tab-page active" id="tab-users"></div>
                <div class="admin-tab-page" id="tab-groups"></div>
                <div class="admin-tab-page" id="tab-plugins"></div>
                <div class="admin-tab-page" id="tab-traffic"></div>
                <div class="admin-tab-page" id="tab-database"></div>
                <div class="admin-tab-page" id="tab-settings"></div>
                <div class="admin-tab-page" id="tab-tools"></div>
            </div>
            <div class="admin-footer">
                <a href="{{ base_path }}/admin?update={{ update }}" target="_blank" rel="noopener">在独立界面中打开 <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg></a>
            </div>
        </div>
    </div>
</div>
