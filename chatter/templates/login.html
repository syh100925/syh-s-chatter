<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>syh's chatter</title>
    <link rel="shortcut icon" href="static/icon.png" type="image/x-icon">
    <style>
        /* ========== 扁平主题变量 ========== */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --fg-primary: #e0e0e0;
            --fg-secondary: #999999;
            --fg-muted: #666666;
            --border-color: #3a3a3a;
            --border-focus: #e0e0e0;
            --accent: #ffffff;
            --accent-hover-text: #1a1a1a;
            --error-color: #ff6b6b;
            --error-glow-1: #ff6b6b;
            --error-glow-2: #ff4444;
            --ok-color: #4caf50;
            /* 格子标号色：与格子前景色/状态色反色，深底用浅字、浅底用深字 */
            --auth-label-color: rgba(0, 0, 0, 0.74);
            --font-mono: 'Jetbrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
            --transition-speed: 0.2s;
            --glow-text-1: #ffffff;
            --glow-text-2: #999999;
        }

        body.light-theme {
            --bg-primary: #fafafa;
            --bg-secondary: #f0f0f0;
            --fg-primary: #1a1a1a;
            --fg-secondary: #555555;
            --fg-muted: #999999;
            --border-color: #cccccc;
            --border-focus: #1a1a1a;
            --accent: #1a1a1a;
            --accent-hover-text: #ffffff;
            --error-color: #d32f2f;
            --error-glow-1: #d32f2f;
            --error-glow-2: #b71c1c;
            --ok-color: #2e7d32;
            --auth-label-color: rgba(255, 255, 255, 0.82);
            --glow-text-1: #1a1a1a;
            --glow-text-2: #666666;
        }

        @font-face {
            font-family: 'Jetbrains Mono';
            src: url('static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== 主题切换按钮 - 纯文字版 ========== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 100;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--fg-secondary);
            padding: 10px 18px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            transition: all var(--transition-speed);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover {
            color: var(--fg-primary);
            border-color: var(--fg-primary);
        }
        .theme-toggle .mode-text {
            display: inline-block;
            min-width: 2.5em;
            text-align: center;
            transition: color 0.3s;
            animation: textPulse 2s infinite;
        }
        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 主题切换 - 圆圈扩散动画（与聊天页同款） ========== */
        .theme-transition {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            pointer-events: none;
            animation: themeReveal 0.5s ease-out forwards;
        }
        @keyframes themeReveal {
            from {
                clip-path: circle(0px at var(--tx, 50%) var(--ty, 50%));
            }
            to {
                clip-path: circle(150vmax at var(--tx, 50%) var(--ty, 50%));
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .theme-transition {
                animation: none;
                opacity: 0;
            }
        }

        /* ========== 主容器 ========== */
        .login-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 0 2rem;
            text-align: center;
        }

        /* ========== 品牌标识 - 动态文字 ========== */
        .brand {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--fg-muted);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 20px;
        }
        .brand .dash {
            display: inline-block;
            width: 20px;
            height: 1px;
            background: var(--border-color);
            transition: background var(--transition-speed);
        }
        .dynamic-word {
            display: inline-block;
            position: relative;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--glow-text-1);
        }
        .dynamic-word span {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            white-space: nowrap;
            animation: wordCycle 4s infinite;
            opacity: 0;
        }
        .dynamic-word span:nth-child(1) {
            animation-delay: 0s;
        }
        .dynamic-word span:nth-child(2) {
            animation-delay: 2s;
        }
        @keyframes wordCycle {
            0%,
            35% {
                opacity: 0;
                transform: translateY(5px);
            }
            40%,
            60% {
                opacity: 1;
                transform: translateY(0);
            }
            65%,
            100% {
                opacity: 0;
                transform: translateY(-5px);
            }
        }

        /* ========== 标题区 ========== */
        .login-title {
            margin-bottom: 3rem;
        }
        .login-title h1 {
            font-size: 2.4rem;
            letter-spacing: 6px;
            font-weight: 400;
            color: var(--fg-primary);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }
        .login-title .divider {
            display: block;
            width: 40px;
            height: 2px;
            background: var(--border-color);
            margin: 0 auto 1rem;
            transition: background var(--transition-speed);
        }
        .login-title p {
            color: var(--fg-muted);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ========== 表单控件 ========== */
        .form-control {
            position: relative;
            margin: 2rem 0;
            text-align: left;
        }
        .form-control input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            padding: 14px 4px 10px;
            font-size: 1rem;
            color: var(--fg-primary);
            font-family: var(--font-mono);
            letter-spacing: 1px;
            outline: none;
            transition: border-color var(--transition-speed);
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .form-control input:focus {
            border-bottom-color: var(--border-focus);
        }
        .form-control input::placeholder {
            color: transparent;
        }
        .form-control label {
            position: absolute;
            left: 4px;
            top: 14px;
            color: var(--fg-muted);
            pointer-events: none;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-control input:focus~label,
        .form-control input:not(:placeholder-shown)~label {
            transform: translateY(-26px);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--fg-secondary);
        }

        /* ========== 提交按钮 ========== */
        button[type="submit"] {
            width: 100%;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--fg-primary);
            padding: 14px 24px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all var(--transition-speed);
            margin-top: 2.5rem;
            text-transform: uppercase;
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        button[type="submit"]:hover {
            background: var(--accent);
            color: var(--accent-hover-text);
            border-color: var(--accent);
        }
        button[type="submit"]:active {
            transform: scale(0.98);
            transition: transform 0.08s;
        }
        button[type="submit"]:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== Retry 按钮（登录失败后停在 ACCESS DENIED 状态框里） ========== */
        .auth-retry {
            /* 绝对定位到状态文字正下方，不占用流内空间。
               用 left/right:0 + flex 居中而非 translateX，
               因为出现动画 retryIn 要独占 transform。 */
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            margin-top: 26px;
            display: flex;
            justify-content: center;
            /* 未出现时不占位也不接收点击；visibility 过渡期间同样不接收 */
            visibility: hidden;
            pointer-events: none;
        }
        .auth-retry.active {
            visibility: visible;
            pointer-events: auto;
        }
        .retry-btn {
            position: relative;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: transparent;
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 10px 26px;
            min-width: 132px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0;
            /* 出现动画与循环脉冲串联：先入场，再持续呼吸提示 */
            animation: none;
            transition: background-color 0.2s ease, color 0.2s ease,
                transform 0.2s ease, border-color 0.2s ease;
        }
        .auth-retry.active .retry-btn {
            animation: retryIn 0.45s ease both,
                retryPulse 1.9s ease 0.45s infinite alternate;
        }
        /* 出现：淡入 + 上滑 + 微缩放。
           to 刻意不写 transform：fill-mode:both 会让 to 的值长期生效，
           从而压过 :hover 的 transform（动画在层叠中优先于普通声明）。 */
        @keyframes retryIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
            to {
                opacity: 1;
            }
        }
        /* 重复：光晕与边框轻微起伏的呼吸脉冲 */
        @keyframes retryPulse {
            from {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0);
                border-color: var(--error-color);
            }
            to {
                box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.14);
                border-color: var(--error-glow-1);
            }
        }
        /* 选择器需与 .auth-retry.active .retry-btn 同级或更高：
           上面的 animation 简写会把 animation-play-state 重置为 running */
        .auth-retry.active .retry-btn:hover {
            background: var(--error-color);
            color: var(--bg-primary);
            transform: translateY(-2px);
            /* 悬停时冻住呼吸脉冲，避免与悬停效果叠加抖动 */
            animation-play-state: paused;
        }
        .auth-retry.active .retry-btn:active {
            transform: translateY(0);
        }
        .retry-btn:focus-visible {
            outline: 1px solid var(--fg-primary);
            outline-offset: 3px;
        }
        body.light-theme .retry-btn:hover {
            color: var(--bg-primary);
        }

        /* reduced-motion 降级路径：表单区的一行文字 + Retry（不进 HUD 舞台） */
        .inline-fail {
            margin-top: 1.2rem;
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .inline-fail.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
        }
        .inline-fail-msg {
            color: var(--error-color);
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
        }
        .inline-fail-btn {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 8px 22px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0;
            transition: background-color 0.2s ease, color 0.2s ease,
                transform 0.2s ease;
        }
        .inline-fail-btn:hover {
            background: var(--error-color);
            color: var(--bg-primary);
            transform: translateY(-2px);
        }

        /* 换档遮罩：淡出到背景色，遮住 document.write 重解析产生的白闪 */
        .nav-fade {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
            z-index: 9999;
        }
        .nav-fade.active {
            opacity: 1;
        }
        @media (prefers-reduced-motion: reduce) {
            .nav-fade {
                transition: none;
            }
            .auth-retry.active .retry-btn {
                animation: none;
            }
            .retry-btn {
                transition: background-color 0.2s ease, color 0.2s ease,
                    transform 0.2s ease, border-color 0.2s ease;
            }
        }

        /* ================================================================
           登录尝试动画舞台
           阶段：装载(格子自右上角对角扩散) → 结果(绿/红) → 消格(右上角优先)
                → 状态条自中点向两边拉开 → 中间面板过渡为新窗口
           所有过渡统一使用 ease。
           ================================================================ */
        .auth-stage {
            --auth-frame-w: min(760px, 88vw);
            --auth-frame-h: min(460px, 52vh);
            /* 格子间隙与状态条尺寸独立于窗口，二者各自用变量控制 */
            --auth-tile-gap: 4px;
            /* 状态条尺寸：两个小竖直长方形 */
            --auth-bar-w: 6px;
            --auth-bar-h: 64px;
            /* HUD 框架 */
            --auth-hud-side-w: 92px;
            --auth-hud-fg: var(--fg-secondary);
            --auth-hud-dim: var(--fg-muted);
            --auth-tile-radius: 2px;
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }
        .auth-stage.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        /* HUD 整体：自中心 ease 缩放展开（连同格子、状态列表、进度条一起） */
        .auth-hud {
            display: flex;
            flex-direction: column;
            gap: 10px;
            /* 兜底上限：窄屏下不允许超出视口。桌面端内容更窄，不受影响 */
            max-width: calc(100vw - 32px);
            transform: scale(0.18);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }
        .auth-stage.active .auth-hud {
            transform: scale(1);
            opacity: 1;
        }

        /* ---- HUD 顶部框架行：[ 标题 | 阶段 | 刻度进度线 | 计时 ] ---- */
        .auth-hud-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.62rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--auth-hud-dim);
            white-space: nowrap;
        }
        .auth-hud-bracket {
            color: var(--fg-muted);
        }
        .auth-hud-sep {
            color: var(--border-color);
        }
        .auth-hud-stage {
            color: var(--auth-hud-fg);
            min-width: 6.5em;
            transition: color 0.3s ease;
        }
        .auth-stage.is-ok .auth-hud-stage {
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-stage {
            color: var(--error-color);
        }
        .auth-hud-clock {
            color: var(--auth-hud-fg);
            font-variant-numeric: tabular-nums;
        }
        /* 刻度进度线：底纹用重复渐变画刻度，填充层随进度推进 */
        .auth-hud-track {
            position: relative;
            flex: 1;
            height: 6px;
            min-width: 60px;
            background: var(--bg-secondary);
        }
        .auth-hud-track-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: var(--auth-hud-fg);
            transition: width 0.25s ease, background-color 0.3s ease;
        }
        /* 刻度叠在填充之上，避免进度走满后刻度被盖住 */
        .auth-hud-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                var(--bg-primary) 0 1px, transparent 1px 12px);
            opacity: 0.65;
        }
        .auth-stage.is-ok .auth-hud-track-fill {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-track-fill {
            background: var(--error-color);
        }

        /* ---- HUD 主体：长方形 + 右侧状态列表 ---- */
        .auth-hud-body {
            display: flex;
            align-items: stretch;
            gap: 12px;
        }

        /* 长方型窗口 + 状态条的共同定位层。
           右侧状态列表让长方形并不在视口正中，所以状态条不能按 50vw 算，
           要放进这个与长方形同尺寸的包裹层，用长方形自身宽度定位边界。 */
        .auth-frame-wrap {
            position: relative;
            width: var(--auth-frame-w);
            /* 可收缩：长方形(88vw) + 右侧状态列表(92px) + 间隙(12px) 在 640~900px
               之间会超过视口，靠 flex-shrink 吸收多余宽度，而不是写死减法。
               min-width:0 是必需的，否则 flex 项不会缩到 width 以下。 */
            flex: 0 1 auto;
            min-width: 0;
            height: var(--auth-frame-h);
        }

        /* 长方型窗口：格子容器 */
        .auth-frame {
            position: absolute;
            inset: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        /* 结果态：轮廓染成状态色 */
        .auth-stage.is-ok .auth-frame {
            border-color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-frame {
            border-color: var(--error-color);
        }

        /* ---- HUD 右侧状态列表：逐条点亮 ---- */
        .auth-hud-side {
            width: var(--auth-hud-side-w);
            /* 不参与收缩：状态列表保持可读，宽度让给长方形 */
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
            border-left: 1px solid var(--border-color);
            padding-left: 8px;
        }
        .auth-hud-item {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--fg-muted);
            opacity: 0.4;
            border-left: 2px solid transparent;
            padding-left: 6px;
            transition: color 0.3s ease, opacity 0.3s ease,
                border-color 0.3s ease;
        }
        .auth-hud-item.lit {
            color: var(--auth-hud-fg);
            opacity: 1;
        }
        .auth-hud-item.active {
            border-left-color: var(--auth-hud-fg);
            color: var(--fg-primary);
        }
        .auth-stage.is-ok .auth-hud-item.active {
            border-left-color: var(--ok-color);
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-item.active {
            border-left-color: var(--error-color);
            color: var(--error-color);
        }

        /* ---- HUD 底部框架行：计数文本 + 进度条 + 提示 ---- */
        .auth-hud-count {
            color: var(--auth-hud-fg);
            font-variant-numeric: tabular-nums;
            min-width: 15em;
        }
        .auth-progress {
            position: relative;
            flex: 1;
            height: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .auth-progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: var(--auth-hud-fg);
            transition: width 0.25s ease, background-color 0.3s ease;
        }
        .auth-stage.is-ok .auth-progress-fill {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-progress-fill {
            background: var(--error-color);
        }
        .auth-hud-prompt {
            color: var(--auth-hud-fg);
            min-width: 9em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 格子层：铺满长方形，随阶段切换显隐；格子之间留出间隙 */
        .auth-tiles {
            position: absolute;
            inset: 0;
            display: grid;
            gap: var(--auth-tile-gap);
        }
        .auth-tile {
            position: relative;
            overflow: hidden;
            border-radius: var(--auth-tile-radius);
            /* 初始前景色：格子一上来就是有存在感的颜色，而不是背景色 */
            background: var(--fg-secondary);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 0.28s ease, transform 0.28s ease,
                background-color 0.3s ease, box-shadow 0.3s ease;
        }
        /* 装载：格子自右上角对角线扩散铺满 */
        .auth-stage.is-filling .auth-tile {
            opacity: 1;
            transform: scale(1);
        }
        /* 消格：同一对角序，右上角先消失 */
        .auth-stage.is-clearing .auth-tile {
            opacity: 0;
            transform: scale(0.3);
        }
        /* 对角扩散的前沿带：正在铺开的那一条对角线高亮描边 */
        .auth-stage.is-filling .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px var(--fg-primary);
        }
        .auth-stage.is-ok .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px #ffffff;
        }
        .auth-stage.is-fail .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px #ffffff;
        }
        /* 行列标号：钉在单格右上角的一个小窗口，宽 = 格宽 35%、高 = 格高 60%，
           里面竖排 R / C 两行。与格子底色反色，保证初始前景色与绿/红状态下都清晰。
           字号由 JS 按这个窗口的实际尺寸内联计算（这里只给兜底值）。 */
        .auth-tile-label {
            position: absolute;
            top: 0;
            right: 0;
            width: 35%;
            height: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 6.4px;
            line-height: 1.05;
            letter-spacing: 0;
            color: var(--auth-label-color);
            white-space: nowrap;
            transition: opacity 0.18s ease;
        }
        /* 两行之间不留额外空隙，行高由上面的 line-height 统一控制 */
        .auth-tile-label > i {
            font-style: normal;
            display: block;
        }
        .auth-stage.is-clearing .auth-tile-label {
            opacity: 0;
        }
        /* 结果态：格子切换绿色 / 红色 */
        .auth-stage.is-ok .auth-tile {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-tile {
            background: var(--error-color);
        }
        /* 格子变成绿/红底后，原标号色（亮色主题为浅色）在红绿上只有 2.3:1，
           几乎看不见；此处统一改为深色，两个主题都有约 5.8:1 */
        .auth-stage.is-ok .auth-tile-label,
        .auth-stage.is-fail .auth-tile-label {
            color: rgba(0, 0, 0, 0.78);
        }

        /* 状态条：自长方形中点向左右两边拉开；两条竖直细长长方形。
           定位在 .auth-frame-wrap 内，故 left:50% 即长方形中点，
           边界也用长方形自身宽度而不是屏幕宽度。
           高度用 margin 负值做垂直居中，以免 translate 被水平位移占掉。 */
        .auth-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            /* 高于中间面板：面板是不透明的，且现在两者都落在长方形范围内 */
            z-index: 2;
            width: var(--auth-bar-w);
            height: var(--auth-bar-h);
            margin-top: calc(var(--auth-bar-h) / -2);
            opacity: 0;
            /* 纯色填充：结果态直接把底色换成状态色，不再靠描边表示状态。
               未出结果时用一档中性色，视觉上仍是实心长方形。 */
            background: var(--fg-muted);
            transition: transform 0.5s ease, opacity 0.3s ease,
                background-color 0.3s ease;
        }
        .auth-stage.is-ok .auth-bar {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-bar {
            background: var(--error-color);
        }
        /* 未拉开时两条贴合在长方形中点 */
        .auth-bar-l {
            transform: translateX(-100%);
        }
        .auth-bar-r {
            transform: translateX(0);
        }
        .auth-stage.is-split .auth-bar {
            opacity: 1;
        }
        /* 两条停在长方形左右边缘内侧 8px（不贴屏幕边）。
           left:50% 定位的是条的左边，故右条需减去自身宽度。 */
        .auth-stage.is-split .auth-bar-l {
            transform: translateX(calc(var(--auth-frame-w) / -2 + 8px));
        }
        .auth-stage.is-split .auth-bar-r {
            transform: translateX(calc(var(--auth-frame-w) / 2 - 8px - var(--auth-bar-w)));
        }
        /* 成功终态：两条竖条继续 ease 移出长方形 */
        .auth-stage.is-leaving .auth-bar-l {
            transform: translateX(calc(var(--auth-frame-w) / -2 - 40vw));
        }
        .auth-stage.is-leaving .auth-bar-r {
            transform: translateX(calc(var(--auth-frame-w) / 2 + 40vw));
        }

        /* 中间背景色长方形：承载状态色提示信息。
           尺寸与长方形一致（内缩 1px 让长方形那圈状态色轮廓仍然可见）。
           z-index 低于状态条，否则不透明的面板会把它们盖住。 */
        .auth-center {
            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 50%;
            width: 100%;
            z-index: 1;
            overflow: hidden;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .auth-stage.is-split .auth-center {
            opacity: 1;
        }
        /* 成功终态：面板淡出，交给注入脚本继续 morph */
        .auth-stage.is-leaving .auth-center {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        /* 状态文字的定位层。Retry 绝对定位在它下方（top:100%），因此状态文字
           始终是本层唯一的流内子元素 —— Retry 出现/消失都不会改变它的
           大小与位置（若让两者都参与 column flex 的居中，Retry 一出现就会
           把文字顶上去）。 */
        .auth-center-stack {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .auth-center-text {
            white-space: nowrap;
            /* 终态主状态词，用 clamp 随视口缩放：窄屏不至于溢出长方形 */
            font-size: clamp(1rem, 2.6vw, 1.5rem);
            letter-spacing: clamp(3px, 0.5vw, 6px);
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease 0.15s;
        }
        .auth-stage.is-split .auth-center-text {
            opacity: 1;
        }
        .auth-stage.is-ok .auth-center-text {
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-center-text {
            color: var(--error-color);
        }

        /* 供读屏软件播报状态 */
        .auth-live {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-stage,
            .auth-frame,
            .auth-tile,
            .auth-bar,
            .auth-center,
            .auth-center-text {
                transition: none;
            }
        }

        /* ========== 底部信息 ========== */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: var(--fg-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .footer-note .dot-sep {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--border-color);
            margin: 0 8px;
            vertical-align: middle;
            transition: background var(--transition-speed);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 0 1.5rem;
                max-width: 100%;
            }
            .login-title h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            button[type="submit"] {
                letter-spacing: 2px;
                font-size: 0.8rem;
            }
            .dynamic-word {
                min-width: 60px;
                font-size: 0.7rem;
            }
        }

        /* ---- 窄屏 HUD：原先固定 92px 的右侧状态列表 + min(760px,88vw) 的长方形
           合计约 434px，比视口还宽，把整个 HUD 顶出屏幕（标题被切、右侧状态列表
           消失、格子右侧被裁）。窄屏下收起状态列表并让长方形接近满宽，
           同一信息仍由顶部阶段词与底部提示词传达。 ---- */
        @media (max-width: 640px) {
            .auth-stage {
                --auth-frame-w: calc(100vw - 32px);
                --auth-frame-h: min(400px, 46vh);
            }
            .auth-hud-side {
                display: none;
            }
            /* 顶部/底部行是 white-space:nowrap 的 flex：不给子项 min-width:0，
               它们不会缩到内容以下，整行宽度就会顶破视口。 */
            .auth-hud-row > *,
            .auth-hud-row {
                min-width: 0;
            }
            /* 刻度线是唯一可压缩项，给它一个下限即可 */
            .auth-hud-track {
                min-width: 24px;
            }
            /* 标题 argv_login·syh-cr 与字距在窄屏太占地方，收起 */
            .auth-hud-row > span:nth-child(2) {
                display: none;
            }
            .auth-hud-row,
            .auth-hud-side {
                font-size: 0.56rem;
                letter-spacing: 1px;
            }
            .auth-hud-stage {
                min-width: 4.5em;
            }
        }
        /* 极窄（≤400px）：连刻度线也收起，避免把标题/阶段词挤没 */
        @media (max-width: 400px) {
            .auth-hud-track {
                display: none;
            }
            .auth-stage {
                --auth-frame-w: calc(100vw - 24px);
            }
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮（纯文字） -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="mode-text" id="modeIndicator">暗</span> <span>主题</span>
    </button>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const modeIndicator = document.getElementById('modeIndicator');

        function setThemeUI(isLight) {
            if (isLight) {
                document.body.classList.add('light-theme');
                modeIndicator.textContent = '亮';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                modeIndicator.textContent = '暗';
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            setThemeUI(true);
        } else {
            setThemeUI(false);
        }

        function startThemeTransition() {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const rect = themeToggle.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const overlay = document.createElement('div');
            overlay.className = 'theme-transition';
            overlay.style.setProperty('--tx', cx + 'px');
            overlay.style.setProperty('--ty', cy + 'px');
            document.body.appendChild(overlay);
            const remove = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
            overlay.addEventListener('animationend', remove, { once: true });
            overlay.addEventListener('animationcancel', remove, { once: true });
            setTimeout(remove, 600);
        }

        themeToggle.addEventListener('click', () => {
            const isLight = !document.body.classList.contains('light-theme');
            setThemeUI(isLight);
            startThemeTransition();
        });
    </script>

    <!-- 登录区域 - 扁平布局，动态文字动画 -->
    <div class="login-container">
        <!-- 品牌标识 - 动态文字替换了原来的图标 -->
        <div class="brand">
            <span class="dash"></span>
            <span class="dynamic-word" id="brandWords">
                <span>SECURE</span>
                <span>ENCRYPT</span>
            </span>
            <span class="dash"></span>
        </div>

        <!-- 标题 -->
        <div class="login-title">
            <h1>SYH-CR</h1>
            <span class="divider"></span>
            <p>syh's chatter · 登录</p>
        </div>

        <!-- 表单 -->
        <div class="login-form-area">
            <form action="{{ base_path }}/chatts" method="POST" autocomplete="off" id="loginForm">
                <div class="form-control">
                    <input type="text" required name="username" id="username" placeholder=" " autocomplete="off">
                    <label for="username">Username</label>
                </div>
                <div class="form-control">
                    <input type="password" required name="password" id="password" placeholder=" " autocomplete="off">
                    <label for="password">Password</label>
                </div>
                <button type="submit" id="loginSubmit">// 进入 //</button>
            </form>

            <!-- reduced-motion 降级路径的失败提示（正常动画路径不显示） -->
            <div class="inline-fail" id="inlineFail">
                <div class="inline-fail-msg" id="inlineFailText"></div>
                <button type="button" class="inline-fail-btn" id="inlineRetryBtn">Retry</button>
            </div>

            <!-- 底部装饰 -->
            <div class="footer-note">
                <span>end-to-end</span>
                <span class="dot-sep"></span>
                <span>encrypted</span>

                <div style="margin-top: 1.5rem; font-size: 0.8rem; letter-spacing: 1px;">
                    <a href="{{ base_path }}/register" style="color: var(--fg-muted); text-decoration: none; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; transition: color 0.2s;">
                        没有账号？立即注册
                    </a>
                </div>

                {% if registered %}
                    <br>
                    <div style="color: var(--fg-secondary); margin-bottom: 1rem;">注册成功，请登录</div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- 登录尝试动画舞台：装饰性内容，供读屏的文本见 .auth-live -->
    <div class="auth-stage" id="authStage" aria-hidden="true">
        <div class="auth-hud" id="authHud">
            <!-- 顶部框架行 -->
            <div class="auth-hud-row">
                <span class="auth-hud-bracket">[</span>
                <span>argv_login·syh-cr</span>
                <span class="auth-hud-sep">|</span>
                <span class="auth-hud-stage" id="authHudStage">BOOT</span>
                <span class="auth-hud-track"><i class="auth-hud-track-fill" id="authTrackFill"></i></span>
                <span class="auth-hud-clock" id="authHudClock">00:00.0</span>
                <span class="auth-hud-bracket">]</span>
            </div>

            <!-- 主体：长方形格子窗口 + 右侧状态列表 -->
            <div class="auth-hud-body">
                <div class="auth-frame-wrap">
                    <div class="auth-frame" id="authFrame">
                        <div class="auth-tiles" id="authTiles"></div>
                    </div>
                    <!-- 状态条与中间面板放在长方形包裹层内：边界按长方形宽度算，
                         且不受 .auth-frame 的 overflow:hidden 裁切 -->
                    <div class="auth-bar auth-bar-l" id="authBarL"></div>
                    <div class="auth-bar auth-bar-r" id="authBarR"></div>
                    <div class="auth-center" id="authCenter">
                        <div class="auth-center-stack" id="authCenterStack">
                            <span class="auth-center-text" id="authCenterText"></span>
                            <!-- 失败后停在状态框里，下方给出重试入口 -->
                            <div class="auth-retry" id="authRetry">
                                <button type="button" class="retry-btn" id="retryBtn">Retry</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="auth-hud-side" id="authSide">
                    <span class="auth-hud-item" data-k="load">load</span>
                    <span class="auth-hud-item" data-k="verify">verify</span>
                    <span class="auth-hud-item" data-k="sync">sync</span>
                    <span class="auth-hud-item" data-k="render">render</span>
                    <span class="auth-hud-item" data-k="commit">commit</span>
                </div>
            </div>

            <!-- 底部框架行：计数 + 进度条 + 提示 -->
            <div class="auth-hud-row">
                <span class="auth-hud-count" id="authHudCount">cells 000/000 · 0%</span>
                <span class="auth-progress"><i class="auth-progress-fill" id="authProgressFill"></i></span>
                <span class="auth-hud-prompt" id="authHudPrompt">&gt;_</span>
            </div>
        </div>
    </div>
    <p class="auth-live" id="authLive" role="status" aria-live="polite"></p>

    <!-- 页面配置（挂载前缀等），见 _base_path 注入约定 -->
    <script>
        window.LOGIN_CONFIG = {
            base_path: {{ base_path|tojson }}
        };
    </script>

    <!-- ========== 登录（fetch 提交 + 无刷新换档） ========== -->
    <script>
        (function () {
            'use strict';

            var BASE_PATH = (window.LOGIN_CONFIG && window.LOGIN_CONFIG.base_path) || '';

            var form = document.getElementById('loginForm');
            var submitBtn = document.getElementById('loginSubmit');
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');
            var DEFAULT_SUBMIT_TEXT = submitBtn.textContent;

            var stage = document.getElementById('authStage');
            var tilesBox = document.getElementById('authTiles');
            var centerText = document.getElementById('authCenterText');
            var liveRegion = document.getElementById('authLive');
            var retryRow = document.getElementById('authRetry');
            var retryBtn = document.getElementById('retryBtn');
            var inlineFailBox = document.getElementById('inlineFail');
            var inlineFailText = document.getElementById('inlineFailText');
            var hudStage = document.getElementById('authHudStage');
            var hudClock = document.getElementById('authHudClock');
            var hudCount = document.getElementById('authHudCount');
            var hudPrompt = document.getElementById('authHudPrompt');
            var trackFill = document.getElementById('authTrackFill');
            var progressFill = document.getElementById('authProgressFill');
            var sideItems = document.getElementById('authSide')
                ? document.getElementById('authSide').querySelectorAll('.auth-hud-item')
                : [];

            // ---- 动画时序（毫秒）----
            // 标号窗口占单格的比例（右上角）。CSS 里也写了同样的值作兜底，
            // 但真正生效的是这里内联出去的 width/height，两处不会走偏。
            var LBL_BOX_W = 0.35;
            var LBL_BOX_H = 0.60;

            var T = {
                cell: 34,        // 格子边长（不含间隙）
                gap: 4,          // 格子间隙，与 --auth-tile-gap 保持一致
                tileIn: 280,     // 单格淡入
                tileOut: 240,    // 单格消失
                // 每层对角线的错峰。取值决定「依次出现 / 逐个消失」是否看得见：
                // 对角层数约 = max(rows,cols)，错峰过小（如 5ms）整场不到
                // 100ms，肉眼只会看到所有格子同时出现/消失。
                stepIn: 30,
                stepOut: 18,
                frame: 450,      // 长方形缩放展开
                fade: 240,       // 舞台淡入
                color: 300,      // 结果换色
                split: 500,      // 状态条拉开
                morph: 450,      // 终态过渡
                // 请求排在铺开动画之后，因此铺满到变色的间隔只需一个很小的值
                gapFill: 120,
                // 变色完成之后再停留这么久才开始消格。位置很关键：要停在
                // 「红/绿已铺满」这个状态上留出可读的静止时间，而不是停在
                // 变色之前（那样只是白等，且看不到状态色）。
                holdPause: 1000,
                // 失败终态：竖条落定后停一下，随后在状态框下方弹出 Retry
                dwellFail: 400,
                dwellOk: 380
            };

            var STATUS_TEXT = {
                ok: 'ACCESS GRANTED',
                fail: 'ACCESS DENIED',
                net: 'CONNECTION LOST'
            };

            var reducedMotion = !!(window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

            var submitting = false;
            var tilesBuilt = false;
            var tileDiagSpan = 1;   // 对角层数，用于精确推算消格总时长
            var tileTotal = 0;      // 格子总数，供 HUD 计数
            var fillSpanMs = 0;     // 铺满整片所需时长
            var fillStartAt = 0;    // 铺开动画开始的时刻
            var tileGroups = [];    // 按对角层分组的格子，供高亮前沿带
            var clockIv = null;

            // ---- HUD 辅助 ----

            function pad(n, w) {
                var s = String(n);
                while (s.length < w) s = '0' + s;
                return s;
            }

            // 顶部阶段词 + 右侧状态列表逐条点亮
            var STAGES = {
                boot: 'BOOT',
                load: 'LOAD',
                verify: 'VERIFY',
                commit: 'COMMIT',
                granted: 'GRANTED',
                denied: 'DENIED',
                lost: 'LOST'
            };

            function setHudStage(name, litCount) {
                hudStage.textContent = STAGES[name] || String(name).toUpperCase();
                for (var i = 0; i < sideItems.length; i++) {
                    var lit = i < litCount;
                    sideItems[i].classList.toggle('lit', lit);
                    sideItems[i].classList.toggle('active', i === litCount - 1 && lit);
                }
            }

            function setHudProgress(filled, total) {
                var pct = total ? Math.round(filled / total * 100) : 0;
                hudCount.textContent = 'cells ' + pad(filled, 3) + '/' + pad(total, 3)
                    + ' · ' + pct + '%';
                var w = pct + '%';
                progressFill.style.width = w;
                trackFill.style.width = w;
            }

            function setHudPrompt(text) {
                hudPrompt.textContent = '> ' + text;
            }

            function startClock() {
                var t0 = Date.now();
                stopClock();
                clockIv = setInterval(function () {
                    var s = (Date.now() - t0) / 1000;
                    hudClock.textContent = '00:' + pad(s < 10 ? '0' + s.toFixed(1) : s.toFixed(1), 4);
                }, 100);
            }

            function stopClock() {
                if (clockIv) { clearInterval(clockIv); clockIv = null; }
            }

            // 高亮正在铺开的那条对角前沿带
            function setFrontier(diag) {
                if (diag < 0 || diag >= tileGroups.length) return;
                for (var d = 0; d < tileGroups.length; d++) {
                    var on = (d === diag);
                    var g = tileGroups[d];
                    for (var i = 0; i < g.length; i++) {
                        if (g[i].classList.contains('frontier') !== on) {
                            g[i].classList.toggle('frontier', on);
                        }
                    }
                }
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            // 依长方形实际布局尺寸建自适应网格；delay 按「距右上角的切比雪夫距离」
            // 递增，形成自右上角扩散的对角带。
            // 注意：必须用 offsetWidth/Height（布局尺寸）而非 getBoundingClientRect，
            // 后者含 scale 变换值，长方形尚在缩放中时会算出一张过小的网格。
            function buildTiles() {
                if (tilesBuilt) return;
                var frame = document.getElementById('authFrame');
                var frameW = frame.offsetWidth;
                var frameH = frame.offsetHeight;
                if (!frameW || !frameH) {
                    // 极端情况（舞台未参与布局）退回视口估算
                    frameW = Math.min(440, window.innerWidth * 0.82);
                    frameH = 232;
                }

                var cols = Math.max(1, Math.round((frameW + T.gap) / (T.cell + T.gap)));
                var rows = Math.max(1, Math.round((frameH + T.gap) / (T.cell + T.gap)));
                tileDiagSpan = Math.max(rows - 1, cols - 1) + 1;
                // 铺满所需时长：最后一层对角线的错峰 + 单格淡入
                fillSpanMs = (tileDiagSpan - 1) * T.stepIn + T.tileIn;
                // 标号窗口 = 单格右上角 35% 宽 × 60% 高（见 CSS），字号按这个窗口算，
                // 而不是按整格算：窗口宽只有格宽的 35%（34px 格 → 约 12px），
                // 而 R11 这类 3 字符记号在 12px 内最多只能到 ~6.4px。
                //   格宽约束：最宽记号 widest 字符 × 等宽 advance≈0.6em
                //   格高约束：两行 × line-height(1.05)
                var cellW = (frameW - (cols - 1) * T.gap) / cols;
                var cellH = (frameH - (rows - 1) * T.gap) / rows;
                var boxW = cellW * LBL_BOX_W;
                var boxH = cellH * LBL_BOX_H;
                var widest = String(Math.max(rows, cols)).length + 1;   // 'R' + 位数
                var fsByW = (boxW - 0.5) / (widest * 0.6);
                var fsByH = (boxH - 0.5) / (2 * 1.05);
                var labelFs = Math.max(4, Math.min(12, fsByW, fsByH)).toFixed(2);
                var html = '';

                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        // 到左上角的切比雪夫距离：diag=0 即左上角那一格
                        var diag = Math.max(r, c);
                        var dIn = diag * T.stepIn;
                        var dOut = diag * T.stepOut;
                        var label = 'R' + (r + 1) + '·C' + (c + 1);
                        html += '<div class="auth-tile" data-diag="' + diag
                            + '" style="transition-delay:'
                            + dIn + 'ms,' + dIn + 'ms,' + dOut + 'ms">'
                            + '<span class="auth-tile-label" title="' + label
                            + '" style="font-size:' + labelFs + 'px;width:'
                            + (LBL_BOX_W * 100) + '%;height:'
                            + (LBL_BOX_H * 100) + '%">'
                            + '<i>R' + (r + 1) + '</i><i>C' + (c + 1) + '</i>'
                            + '</span>'
                            + '</div>';
                    }
                }
                tilesBox.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
                tilesBox.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
                tilesBox.style.gap = T.gap + 'px';
                tilesBox.innerHTML = html;
                // 按对角层分组，供高亮前沿带
                tileGroups = [];
                for (var d = 0; d < tileDiagSpan; d++) tileGroups.push([]);
                var kids = tilesBox.children;
                for (var n = 0; n < kids.length; n++) {
                    var idx = kids[n].getAttribute('data-diag');
                    tileGroups[parseInt(idx, 10)].push(kids[n]);
                }
                tileTotal = cols * rows;
                setHudProgress(0, tileTotal);
                tilesBuilt = true;
            }

            function setSubmitting(flag) {
                submitting = flag;
                submitBtn.disabled = flag;
                submitBtn.textContent = flag ? '// 验证中 //' : DEFAULT_SUBMIT_TEXT;
            }

            // 淡出登录区内容（长方形出现的同时）
            function hideFormArea() {
                var area = document.querySelector('.login-form-area');
                var brand = document.querySelector('.brand');
                var title = document.querySelector('.login-title');
                [area, brand, title].forEach(function (el) {
                    if (!el) return;
                    el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0.97)';
                });
            }

            function restoreFormArea() {
                var area = document.querySelector('.login-form-area');
                var brand = document.querySelector('.brand');
                var title = document.querySelector('.login-title');
                [area, brand, title].forEach(function (el) {
                    if (!el) return;
                    el.style.opacity = '';
                    el.style.transform = '';
                });
            }

            // 把舞台整个复位到未开始的状态（Retry 后重新走一遍动画）
            function resetStage() {
                stage.classList.remove('active', 'is-split', 'is-filling', 'is-clearing',
                    'is-ok', 'is-fail', 'is-leaving');
                retryRow.classList.remove('active');
                tilesBuilt = false;
                tileGroups = [];
                tilesBox.innerHTML = '';
                centerText.textContent = '';
                stopClock();
                setHudStage('boot', 0);
                setHudProgress(0, 0);
                setHudPrompt('> _');
                hudClock.textContent = '00:00.0';
                liveRegion.textContent = '';
            }

            // 失败终态：在 ACCESS DENIED 状态框下方弹出 Retry
            function showRetry() {
                retryRow.classList.add('active');
                liveRegion.textContent = '验证失败，可以重试';
                if (retryBtn) retryBtn.focus();
            }

            // reduced-motion 降级路径：不进 HUD 舞台，改在表单区显示一行文字 + Retry
            function inlineFail(message) {
                if (!inlineFailBox) return;
                inlineFailText.textContent = message;
                inlineFailBox.classList.add('active');
            }

            // 换档时注入：把长方形终态精确落到真实 #chat 的矩形上。
            // document.open() 会销毁本页 JS 上下文，此处只能把代码以字符串形式
            // 注入目标页 —— 时长与配色在此内联为字面量。
            function buildMorphInject(token) {
                return '<style id="auth-morph-style">'
                    + '#auth-morph-stage{position:fixed;inset:0;z-index:10001;'
                    + 'pointer-events:none;overflow:hidden}'
                    + '#auth-morph-center{position:absolute;background:var(--bg-primary);'
                    + 'transform-origin:center center;transition:none}'
                    + '@media (prefers-reduced-motion: reduce){ #auth-morph-center{transition:none}}'
                    + '</style>'
                    + '<div id="auth-morph-stage" aria-hidden="true">'
                    + '<div id="auth-morph-center"></div></div>'
                    + '<script>(function(){var d=document.getElementById("auth-morph-center");'
                    + 'var s=document.getElementById("auth-morph-stage");'
                    + 'function place(sel,anim){var t=document.querySelector(sel);'
                    + 'if(!t){return false;}var r=t.getBoundingClientRect();'
                    + 'if(!r.width||!r.height){return false;}'
                    // 记录落位依据的矩形，便于验证「精确落到 #chat 的矩形」
                    + 'window.__AUTH_MORPH_FROM={l:Math.round(r.left),t:Math.round(r.top),'
                    + 'w:Math.round(r.width),h:Math.round(r.height),sel:sel};'
                    + 'd.style.transition="none";'
                    + 'd.style.left=r.left+"px";d.style.top=r.top+"px";'
                    + 'd.style.width=r.width+"px";d.style.height=r.height+"px";'
                    + 'void d.offsetWidth;'
                    + 'd.style.transition=anim;return true;}'
                    + 'function run(){'
                    // #chat 自带 fadeInUp 入场（含 translateY），测量前先摘掉，
                    // 否则量到的是动画中间态的矩形（与 chat.js 主题切换同一做法）
                    + 'var c=document.getElementById("chat");'
                    + 'if(c){c.style.animation="none";}'
                    + 'void document.body.offsetWidth;'
                    + 'var ok=place("#chat","all ' + T.morph + 'ms ease");'
                    + 'if(!ok){ok=place("#body","all ' + T.morph + 'ms ease");}'
                    + 'if(ok){setTimeout(function(){s.remove();},'+ T.morph + '+60);}'
                    + 'else{s.remove();}}'
                    + 'if(document.readyState==="loading"){'
                    + 'document.addEventListener("DOMContentLoaded",run);}else{run();}'
                    + '})();<\/script>';
            }

            // 无刷新换档：fetch 目标页 HTML → 整档替换并同步地址栏。
            // document.open() 会重置文档并重建全局作用域，因此 chat.js 顶层的
            // const BASE_PATH 可正常重新声明；document.close() 结束解析后同样会
            // 重新触发 DOMContentLoaded，chat.js 的初始化照常执行。
            function softNavigate(url, withMorph) {
                return fetch(url, { credentials: 'same-origin' }).then(function (response) {
                    // 被重定向（会话失效等）或返回非 200 时放弃换档，走整页跳转兜底
                    if (response.redirected || !response.ok) {
                        window.location.assign(BASE_PATH + '/');
                        return null;
                    }
                    return response.text();
                }).then(function (html) {
                    if (html === null) return;
                    if (withMorph) {
                        html = html.replace('</body>', buildMorphInject(url) + '</body>');
                    }
                    // 关键：document.open() 会立刻清空当前文档，而新文档的
                    // body 背景是靠 chat.css 里的 body{background:var(--bg-primary)}
                    // 上色的。在那份样式表下载并生效之前，页面画布是浏览器默认的
                    // 白色 —— 深色主题下就是「闪一下白屏」。
                    // 这里把当前主题的 --bg-primary 作为内联关键样式插到 <head>
                    // 最前面：内联样式不依赖任何外部请求，解析到就能上色，
                    // 之后 chat.css 生效时值相同，不会再产生第二次跳变。
                    var bg = getComputedStyle(document.body)
                        .getPropertyValue('--bg-primary').trim() || '#1a1a1a';
                    html = html.replace(/<head>/i,
                        '<head><style>html{background:' + bg + '}'
                        + 'body{background:' + bg + '}</style>');

                    var reduced = reducedMotion;
                    var delay = reduced ? 0 : 180;

                    setTimeout(function () {
                        // replaceState 而非 pushState：document.write 已不可逆地替换了
                        // 本文档，pushState 会让浏览器后退时去恢复一个不存在的登录页。
                        history.replaceState(null, '', url);
                        document.open();
                        document.write(html);
                        document.close();
                    }, delay);
                });
            }

            // 阶段 A（装载）：点击即刻开始铺格子，不等服务器返回
            function beginFill() {
                stage.classList.add('active');
                hideFormArea();
                void stage.offsetWidth;   // 强制回流，让缩放过渡从 0 起播
                buildTiles();
                // 关键：插入格子后必须再回流一次，把 opacity:0 的初始态刷出来。
                // 否则「建格子」与「加 is-filling」落在同一帧，浏览器首次样式计算
                // 就已是 opacity:1，过渡不会发生——表现为所有格子同时出现。
                void tilesBox.offsetWidth;
                stage.classList.add('is-filling');
                fillStartAt = Date.now();
                liveRegion.textContent = '正在验证';
                setHudStage('load', 1);
                setHudPrompt('load cells');
                startClock();
                // 前沿带跟随对角错峰推进，计数与进度条同步
                var total = tileDiagSpan;
                var t0 = Date.now();
                var lastDiag = -1;
                var iv = setInterval(function () {
                    if (!stage.classList.contains('active')) { clearInterval(iv); return; }
                    var diag = Math.min(total - 1,
                        Math.floor((Date.now() - t0) / T.stepIn));
                    if (diag === lastDiag) return;
                    setFrontier(diag);
                    // 已铺开 = 对角层 0..diag 的格子数
                    var filled = 0;
                    for (var d = 0; d <= diag && d < total; d++) filled += tileGroups[d].length;
                    setHudProgress(filled, tileTotal);
                    lastDiag = diag;
                }, 30);
            }

            // 阶段 B~E：结果 → 消格 → 状态条拉开 → 终态
            // 阶段 B~E：结果 → 消格 → 状态条拉开 → 终态。
            // 请求已在铺开动画播完后发出，故此处只需 gapFill 的小间隔。
            function playAttempt(result) {
                var ok = result.kind === 'ok';

                function doneA() {
                    // 结果：格子与轮廓切绿/红
                    stopClock();
                    setFrontier(-1);
                    stage.classList.add(ok ? 'is-ok' : 'is-fail');
                    centerText.textContent = STATUS_TEXT[result.kind] || STATUS_TEXT.fail;
                    liveRegion.textContent = ok ? '验证通过' : '验证失败';
                    setHudProgress(tileTotal, tileTotal);
                    setHudStage('verify', 2);
                    setHudPrompt(ok ? 'hold · session open' : 'hold · rejected');
                    return wait(T.color);
                }

                function stageC() {
                    stage.classList.remove('is-filling');
                    stage.classList.add('is-clearing');
                    setHudPrompt('clear cells');
                    // 最后一层格子的 delay + 单格消失时长
                    return wait(T.tileOut + (tileDiagSpan - 1) * T.stepOut + 60);
                }

                function stageD() {
                    stage.classList.add('is-split');
                    setHudStage(ok ? 'granted' : 'denied', 5);
                    setHudPrompt(ok ? 'open session' : 'reject');
                    // 拉到位后先停留，再进入终态，否则收尾动画会在到位瞬间就盖上来
                    return wait(T.split + (ok ? T.dwellOk : T.dwellFail));
                }

                function stageE() {
                    stopClock();
                    if (ok) {
                        // 成功：竖条继续移出，中间面板交给注入脚本过渡到 #chat
                        setHudStage('commit', 5);
                        stage.classList.add('is-leaving');
                        return wait(T.morph).then(function () {
                            return softNavigate(
                                BASE_PATH + '/chatts?update=' + encodeURIComponent(result.token), true
                            );
                        });
                    }
                    // 失败终态：舞台原地定格在 ACCESS DENIED 状态框上，不拆台、
                    // 不弹旧故障页、也不还原表单（表单保持隐藏），只在状态框下方
                    // 弹出 Retry。
                    setHudStage('denied', 5);
                    setHudPrompt(result.kind === 'net' ? 'retry' : 'locked · retry');
                    setSubmitting(false);
                    passwordInput.value = '';
                    showRetry();
                }

                // 请求本身排在铺开动画之后（见 submit 处理），所以结果回来时铺满
                // 早已结束；这里只需一个很小的间隔，再变色。
                return wait(T.gapFill)
                    .then(doneA)                       // 变色，并等颜色过渡走完
                    .then(function () {                // 变色完成后停留片刻
                        return wait(T.holdPause);
                    })
                    .then(stageC)                      // 然后才逐格消失
                    .then(stageD)
                    .then(stageE);
            }

            // 发送登录请求（统一出口，供动画路径与 reduced-motion 降级路径复用）
            function sendLogin(username, password) {
                return fetch(BASE_PATH + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                }).then(function (response) {
                    return response.json().then(function (data) {
                        return { ok: response.ok && !!data.ok, data: data };
                    }).catch(function () {
                        return { ok: false, data: {} };
                    });
                }).then(function (res) {
                    if (res.ok && res.data.update) {
                        return { kind: 'ok', token: res.data.update };
                    }
                    return { kind: 'fail' };
                }).catch(function () {
                    return { kind: 'net' };
                });
            }

            form.addEventListener('submit', function (event) {
                // JS 可用时走 fetch；脚本未加载/被禁用时表单仍可原生 POST 到
                // /chatts，由服务端按原逻辑 302 到 /error 兜底。
                if (typeof window.fetch !== 'function') return;
                event.preventDefault();
                if (submitting) return;

                var username = (usernameInput.value || '').trim();
                var password = passwordInput.value || '';
                if (!username || !password) return;

                resetStage();
                setSubmitting(true);

                if (reducedMotion) {
                    // 降级：不放动画，立即发请求；失败在表单区给一行文字 + Retry
                    sendLogin(username, password).then(function (result) {
                        if (result.kind === 'ok') {
                            softNavigate(
                                BASE_PATH + '/chatts?update=' + encodeURIComponent(result.token), false
                            );
                            return;
                        }
                        setSubmitting(false);
                        passwordInput.value = '';
                        inlineFail(result.kind === 'net'
                            ? '连接失败，请检查网络'
                            : '密码错误，请重新登录');
                    });
                    return;
                }

                // 先把铺开动画播完，再发送请求
                beginFill();
                wait(fillSpanMs).then(function () {
                    return sendLogin(username, password);
                }).then(function (result) {
                    return playAttempt(result);
                });
            });

            // Retry：还原表单，交回输入；下一次提交会重播整段动画并重发请求
            if (retryBtn) {
                retryBtn.addEventListener('click', function () {
                    if (submitting) return;
                    resetStage();
                    restoreFormArea();
                    setSubmitting(false);
                    passwordInput.focus();
                });
            }

            // reduced-motion 降级路径用的行内提示（不进 HUD 舞台）
            if (inlineFailBox) {
                inlineFailBox.addEventListener('click', function (ev) {
                    if (ev.target && ev.target.id === 'inlineRetryBtn') {
                        inlineFailBox.classList.remove('active');
                        setSubmitting(false);
                        passwordInput.focus();
                    }
                });
            }
        })();
    </script>
</body>
</html>
