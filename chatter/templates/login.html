<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>syh's chatter</title>
    <link rel="shortcut icon" href="static/icon.png" type="image/x-icon">
    <style>
        /* ========== 扁平主题变量 ========== */
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --fg-primary: #e0e0e0;
            --fg-secondary: #999999;
            --fg-muted: #666666;
            --border-color: #3a3a3a;
            --border-focus: #e0e0e0;
            --accent: #ffffff;
            --accent-hover-text: #1a1a1a;
            --error-color: #ff6b6b;
            --error-glow-1: #ff6b6b;
            --error-glow-2: #ff4444;
            --ok-color: #4caf50;
            /* 格子标号色：与格子前景色/状态色反色，深底用浅字、浅底用深字 */
            --auth-label-color: rgba(255, 255, 255, 0.72);
            --font-mono: 'Jetbrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
            --transition-speed: 0.2s;
            --glow-text-1: #ffffff;
            --glow-text-2: #999999;
        }

        body.light-theme {
            --bg-primary: #fafafa;
            --bg-secondary: #f0f0f0;
            --fg-primary: #1a1a1a;
            --fg-secondary: #555555;
            --fg-muted: #999999;
            --border-color: #cccccc;
            --border-focus: #1a1a1a;
            --accent: #1a1a1a;
            --accent-hover-text: #ffffff;
            --error-color: #d32f2f;
            --error-glow-1: #d32f2f;
            --error-glow-2: #b71c1c;
            --ok-color: #2e7d32;
            --auth-label-color: rgba(0, 0, 0, 0.58);
            --glow-text-1: #1a1a1a;
            --glow-text-2: #666666;
        }

        @font-face {
            font-family: 'Jetbrains Mono';
            src: url('static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ========== 主题切换按钮 - 纯文字版 ========== */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 100;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--fg-secondary);
            padding: 10px 18px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 2px;
            transition: all var(--transition-speed);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-toggle:hover {
            color: var(--fg-primary);
            border-color: var(--fg-primary);
        }
        .theme-toggle .mode-text {
            display: inline-block;
            min-width: 2.5em;
            text-align: center;
            transition: color 0.3s;
            animation: textPulse 2s infinite;
        }
        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 主题切换 - 圆圈扩散动画（与聊天页同款） ========== */
        .theme-transition {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            pointer-events: none;
            animation: themeReveal 0.5s ease-out forwards;
        }
        @keyframes themeReveal {
            from {
                clip-path: circle(0px at var(--tx, 50%) var(--ty, 50%));
            }
            to {
                clip-path: circle(150vmax at var(--tx, 50%) var(--ty, 50%));
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .theme-transition {
                animation: none;
                opacity: 0;
            }
        }

        /* ========== 主容器 ========== */
        .login-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 0 2rem;
            text-align: center;
        }

        /* ========== 品牌标识 - 动态文字 ========== */
        .brand {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--fg-muted);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 20px;
        }
        .brand .dash {
            display: inline-block;
            width: 20px;
            height: 1px;
            background: var(--border-color);
            transition: background var(--transition-speed);
        }
        .dynamic-word {
            display: inline-block;
            position: relative;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--glow-text-1);
        }
        .dynamic-word span {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            white-space: nowrap;
            animation: wordCycle 4s infinite;
            opacity: 0;
        }
        .dynamic-word span:nth-child(1) {
            animation-delay: 0s;
        }
        .dynamic-word span:nth-child(2) {
            animation-delay: 2s;
        }
        @keyframes wordCycle {
            0%,
            35% {
                opacity: 0;
                transform: translateY(5px);
            }
            40%,
            60% {
                opacity: 1;
                transform: translateY(0);
            }
            65%,
            100% {
                opacity: 0;
                transform: translateY(-5px);
            }
        }

        /* 登录失败态：品牌词切换为 DENIED / BLOCKED 故障动画 */
        .dynamic-word.is-error {
            min-width: 90px;
            color: var(--error-glow-1);
        }
        .dynamic-word.is-error span {
            animation: errorWordCycle 3s infinite;
        }
        @keyframes errorWordCycle {
            0%,
            30% {
                opacity: 0;
                transform: translateY(4px);
            }
            35%,
            65% {
                opacity: 1;
                transform: translateY(0);
            }
            70%,
            100% {
                opacity: 0;
                transform: translateY(-4px);
            }
        }

        /* ========== 标题区 ========== */
        .login-title {
            margin-bottom: 3rem;
        }
        .login-title h1 {
            font-size: 2.4rem;
            letter-spacing: 6px;
            font-weight: 400;
            color: var(--fg-primary);
            margin-bottom: 0.6rem;
            text-transform: uppercase;
        }
        .login-title .divider {
            display: block;
            width: 40px;
            height: 2px;
            background: var(--border-color);
            margin: 0 auto 1rem;
            transition: background var(--transition-speed);
        }
        .login-title p {
            color: var(--fg-muted);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ========== 表单控件 ========== */
        .form-control {
            position: relative;
            margin: 2rem 0;
            text-align: left;
        }
        .form-control input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            padding: 14px 4px 10px;
            font-size: 1rem;
            color: var(--fg-primary);
            font-family: var(--font-mono);
            letter-spacing: 1px;
            outline: none;
            transition: border-color var(--transition-speed);
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .form-control input:focus {
            border-bottom-color: var(--border-focus);
        }
        .form-control input::placeholder {
            color: transparent;
        }
        .form-control label {
            position: absolute;
            left: 4px;
            top: 14px;
            color: var(--fg-muted);
            pointer-events: none;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-control input:focus~label,
        .form-control input:not(:placeholder-shown)~label {
            transform: translateY(-26px);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--fg-secondary);
        }

        /* ========== 提交按钮 ========== */
        button[type="submit"] {
            width: 100%;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--fg-primary);
            padding: 14px 24px;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            letter-spacing: 4px;
            cursor: pointer;
            transition: all var(--transition-speed);
            margin-top: 2.5rem;
            text-transform: uppercase;
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        button[type="submit"]:hover {
            background: var(--accent);
            color: var(--accent-hover-text);
            border-color: var(--accent);
        }
        button[type="submit"]:active {
            transform: scale(0.98);
            transition: transform 0.08s;
        }
        button[type="submit"]:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== 登录失败覆盖层（复用 login_error 的 LOCKED 故障动画） ========== */
        .login-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--bg-primary);
            opacity: 0;
            visibility: hidden;
            /* 未激活时必须完全不接收指针事件：visibility 的淡出过渡期间元素
               仍按 visible 处理，若不禁用会在 0.3s 内吞掉用户的重试点击 */
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .login-error.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .error-animation-text {
            font-size: 3.5rem;
            font-weight: 500;
            letter-spacing: 8px;
            color: var(--error-glow-1);
            text-transform: uppercase;
            animation: errorTextFlicker 2.5s infinite;
            line-height: 1.2;
        }
        @keyframes errorTextFlicker {
            0%,
            19%,
            21%,
            23%,
            25%,
            54%,
            56%,
            100% {
                opacity: 1;
                color: var(--error-glow-1);
            }
            20%,
            24%,
            55% {
                opacity: 0.4;
                color: var(--error-glow-2);
            }
        }
        .error-message {
            color: var(--fg-secondary);
            font-size: 1rem;
            letter-spacing: 1px;
            text-align: center;
        }
        .error-message .highlight {
            color: var(--error-color);
            font-weight: 500;
            letter-spacing: 2px;
            animation: highlightPulse 2s infinite;
        }
        @keyframes highlightPulse {
            0%,
            100% {
                opacity: 0.85;
            }
            50% {
                opacity: 1;
            }
        }
        .error-hint {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: var(--fg-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* 失败时表单整体轻微抖动 */
        @keyframes errorShake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(5px);
            }
            60% {
                transform: translateX(-3px);
            }
            80% {
                transform: translateX(2px);
            }
        }
        .login-error.active ~ .login-form-area {
            animation: errorShake 0.4s ease;
        }
        /* 换档遮罩：淡出到背景色，遮住 document.write 重解析产生的白闪 */
        .nav-fade {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
            z-index: 9999;
        }
        .nav-fade.active {
            opacity: 1;
        }
        @media (prefers-reduced-motion: reduce) {
            .login-error,
            .nav-fade {
                transition: none;
            }
            .login-error.active ~ .login-form-area {
                animation: none;
            }
        }

        /* ================================================================
           登录尝试动画舞台
           阶段：装载(格子自右上角对角扩散) → 结果(绿/红) → 消格(右上角优先)
                → 状态条自中点向两边拉开 → 中间面板过渡为新窗口
           所有过渡统一使用 ease。
           ================================================================ */
        .auth-stage {
            --auth-frame-w: min(760px, 88vw);
            --auth-frame-h: min(460px, 52vh);
            /* 格子间隙与状态条尺寸独立于窗口，二者各自用变量控制 */
            --auth-tile-gap: 4px;
            /* 状态条尺寸：两个小竖直长方形 */
            --auth-bar-w: 6px;
            --auth-bar-h: 64px;
            /* HUD 框架 */
            --auth-hud-side-w: 92px;
            --auth-hud-fg: var(--fg-secondary);
            --auth-hud-dim: var(--fg-muted);
            --auth-tile-radius: 2px;
            position: fixed;
            inset: 0;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }
        .auth-stage.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        /* HUD 整体：自中心 ease 缩放展开（连同格子、状态列表、进度条一起） */
        .auth-hud {
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: scale(0.18);
            opacity: 0;
            transition: transform 0.45s ease, opacity 0.45s ease;
        }
        .auth-stage.active .auth-hud {
            transform: scale(1);
            opacity: 1;
        }

        /* ---- HUD 顶部框架行：[ 标题 | 阶段 | 刻度进度线 | 计时 ] ---- */
        .auth-hud-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.62rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--auth-hud-dim);
            white-space: nowrap;
        }
        .auth-hud-bracket {
            color: var(--fg-muted);
        }
        .auth-hud-sep {
            color: var(--border-color);
        }
        .auth-hud-stage {
            color: var(--auth-hud-fg);
            min-width: 6.5em;
            transition: color 0.3s ease;
        }
        .auth-stage.is-ok .auth-hud-stage {
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-stage {
            color: var(--error-color);
        }
        .auth-hud-clock {
            color: var(--auth-hud-fg);
            font-variant-numeric: tabular-nums;
        }
        /* 刻度进度线：底纹用重复渐变画刻度，填充层随进度推进 */
        .auth-hud-track {
            position: relative;
            flex: 1;
            height: 6px;
            min-width: 60px;
            background: var(--bg-secondary);
        }
        .auth-hud-track-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: var(--auth-hud-fg);
            transition: width 0.25s ease, background-color 0.3s ease;
        }
        /* 刻度叠在填充之上，避免进度走满后刻度被盖住 */
        .auth-hud-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                var(--bg-primary) 0 1px, transparent 1px 12px);
            opacity: 0.65;
        }
        .auth-stage.is-ok .auth-hud-track-fill {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-track-fill {
            background: var(--error-color);
        }

        /* ---- HUD 主体：长方形 + 右侧状态列表 ---- */
        .auth-hud-body {
            display: flex;
            align-items: stretch;
            gap: 12px;
        }

        /* 长方型窗口 + 状态条的共同定位层。
           右侧状态列表让长方形并不在视口正中，所以状态条不能按 50vw 算，
           要放进这个与长方形同尺寸的包裹层，用长方形自身宽度定位边界。 */
        .auth-frame-wrap {
            position: relative;
            width: var(--auth-frame-w);
            height: var(--auth-frame-h);
        }

        /* 长方型窗口：格子容器 */
        .auth-frame {
            position: absolute;
            inset: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        /* 结果态：轮廓染成状态色 */
        .auth-stage.is-ok .auth-frame {
            border-color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-frame {
            border-color: var(--error-color);
        }

        /* ---- HUD 右侧状态列表：逐条点亮 ---- */
        .auth-hud-side {
            width: var(--auth-hud-side-w);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
            border-left: 1px solid var(--border-color);
            padding-left: 8px;
        }
        .auth-hud-item {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--fg-muted);
            opacity: 0.4;
            border-left: 2px solid transparent;
            padding-left: 6px;
            transition: color 0.3s ease, opacity 0.3s ease,
                border-color 0.3s ease;
        }
        .auth-hud-item.lit {
            color: var(--auth-hud-fg);
            opacity: 1;
        }
        .auth-hud-item.active {
            border-left-color: var(--auth-hud-fg);
            color: var(--fg-primary);
        }
        .auth-stage.is-ok .auth-hud-item.active {
            border-left-color: var(--ok-color);
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-hud-item.active {
            border-left-color: var(--error-color);
            color: var(--error-color);
        }

        /* ---- HUD 底部框架行：计数文本 + 进度条 + 提示 ---- */
        .auth-hud-count {
            color: var(--auth-hud-fg);
            font-variant-numeric: tabular-nums;
            min-width: 15em;
        }
        .auth-progress {
            position: relative;
            flex: 1;
            height: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        .auth-progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: var(--auth-hud-fg);
            transition: width 0.25s ease, background-color 0.3s ease;
        }
        .auth-stage.is-ok .auth-progress-fill {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-progress-fill {
            background: var(--error-color);
        }
        .auth-hud-prompt {
            color: var(--auth-hud-fg);
            min-width: 9em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 格子层：铺满长方形，随阶段切换显隐；格子之间留出间隙 */
        .auth-tiles {
            position: absolute;
            inset: 0;
            display: grid;
            gap: var(--auth-tile-gap);
        }
        .auth-tile {
            position: relative;
            overflow: hidden;
            border-radius: var(--auth-tile-radius);
            /* 初始前景色：格子一上来就是有存在感的颜色，而不是背景色 */
            background: var(--fg-secondary);
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 0.28s ease, transform 0.28s ease,
                background-color 0.3s ease, box-shadow 0.3s ease;
        }
        /* 装载：格子自右上角对角线扩散铺满 */
        .auth-stage.is-filling .auth-tile {
            opacity: 1;
            transform: scale(1);
        }
        /* 消格：同一对角序，右上角先消失 */
        .auth-stage.is-clearing .auth-tile {
            opacity: 0;
            transform: scale(0.3);
        }
        /* 对角扩散的前沿带：正在铺开的那一条对角线高亮描边 */
        .auth-stage.is-filling .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px var(--fg-primary);
        }
        .auth-stage.is-ok .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px #ffffff;
        }
        .auth-stage.is-fail .auth-tile.frontier {
            box-shadow: inset 0 0 0 1px #ffffff;
        }
        /* 行列标号：与格子底色反色，保证初始前景色与绿/红状态下都清晰。
           字号由 JS 按实际格宽内联设置（这里只给兜底值） */
        .auth-tile-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            line-height: 1;
            letter-spacing: 0;
            color: var(--auth-label-color);
            white-space: nowrap;
            transition: opacity 0.18s ease;
        }
        .auth-stage.is-clearing .auth-tile-label {
            opacity: 0;
        }
        /* 结果态：格子切换绿色 / 红色 */
        .auth-stage.is-ok .auth-tile {
            background: var(--ok-color);
        }
        .auth-stage.is-fail .auth-tile {
            background: var(--error-color);
        }

        /* 状态条：自长方形中点向左右两边拉开；两条竖直细长长方形。
           定位在 .auth-frame-wrap 内，故 left:50% 即长方形中点，
           边界也用长方形自身宽度而不是屏幕宽度。
           高度用 margin 负值做垂直居中，以免 translate 被水平位移占掉。 */
        .auth-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            /* 高于中间面板：面板是不透明的，且现在两者都落在长方形范围内 */
            z-index: 2;
            width: var(--auth-bar-w);
            height: var(--auth-bar-h);
            margin-top: calc(var(--auth-bar-h) / -2);
            opacity: 0;
            /* 本体只比页面底色亮一档；状态色交给描边 */
            background: var(--bg-secondary);
            border: 1px solid var(--fg-muted);
            transition: transform 0.5s ease, opacity 0.3s ease,
                border-color 0.3s ease;
        }
        .auth-stage.is-ok .auth-bar {
            border-color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-bar {
            border-color: var(--error-color);
        }
        /* 未拉开时两条贴合在长方形中点 */
        .auth-bar-l {
            transform: translateX(-100%);
        }
        .auth-bar-r {
            transform: translateX(0);
        }
        .auth-stage.is-split .auth-bar {
            opacity: 1;
        }
        /* 两条停在长方形左右边缘内侧 8px（不贴屏幕边）。
           left:50% 定位的是条的左边，故右条需减去自身宽度。 */
        .auth-stage.is-split .auth-bar-l {
            transform: translateX(calc(var(--auth-frame-w) / -2 + 8px));
        }
        .auth-stage.is-split .auth-bar-r {
            transform: translateX(calc(var(--auth-frame-w) / 2 - 8px - var(--auth-bar-w)));
        }
        /* 成功终态：两条竖条继续 ease 移出长方形 */
        .auth-stage.is-leaving .auth-bar-l {
            transform: translateX(calc(var(--auth-frame-w) / -2 - 40vw));
        }
        .auth-stage.is-leaving .auth-bar-r {
            transform: translateX(calc(var(--auth-frame-w) / 2 + 40vw));
        }

        /* 中间背景色长方形：承载状态色提示信息。
           尺寸与长方形一致（内缩 1px 让长方形那圈状态色轮廓仍然可见）。
           z-index 低于状态条，否则不透明的面板会把它们盖住。 */
        .auth-center {
            position: absolute;
            top: 1px;
            bottom: 1px;
            left: 50%;
            width: 100%;
            z-index: 1;
            overflow: hidden;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .auth-stage.is-split .auth-center {
            opacity: 1;
        }
        /* 成功终态：面板淡出，交给注入脚本继续 morph */
        .auth-stage.is-leaving .auth-center {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .auth-center-text {
            white-space: nowrap;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease 0.15s;
        }
        .auth-stage.is-split .auth-center-text {
            opacity: 1;
        }
        .auth-stage.is-ok .auth-center-text {
            color: var(--ok-color);
        }
        .auth-stage.is-fail .auth-center-text {
            color: var(--error-color);
        }

        /* 供读屏软件播报状态 */
        .auth-live {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-stage,
            .auth-frame,
            .auth-tile,
            .auth-bar,
            .auth-center,
            .auth-center-text {
                transition: none;
            }
        }

        /* ========== 底部信息 ========== */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: var(--fg-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .footer-note .dot-sep {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--border-color);
            margin: 0 8px;
            vertical-align: middle;
            transition: background var(--transition-speed);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 0 1.5rem;
                max-width: 100%;
            }
            .login-title h1 {
                font-size: 1.8rem;
                letter-spacing: 4px;
            }
            button[type="submit"] {
                letter-spacing: 2px;
                font-size: 0.8rem;
            }
            .dynamic-word {
                min-width: 60px;
                font-size: 0.7rem;
            }
            .dynamic-word.is-error {
                min-width: 78px;
            }
            .error-animation-text {
                font-size: 2.6rem;
                letter-spacing: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮（纯文字） -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="mode-text" id="modeIndicator">暗</span> <span>主题</span>
    </button>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const modeIndicator = document.getElementById('modeIndicator');

        function setThemeUI(isLight) {
            if (isLight) {
                document.body.classList.add('light-theme');
                modeIndicator.textContent = '亮';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                modeIndicator.textContent = '暗';
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            setThemeUI(true);
        } else {
            setThemeUI(false);
        }

        function startThemeTransition() {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const rect = themeToggle.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const overlay = document.createElement('div');
            overlay.className = 'theme-transition';
            overlay.style.setProperty('--tx', cx + 'px');
            overlay.style.setProperty('--ty', cy + 'px');
            document.body.appendChild(overlay);
            const remove = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
            overlay.addEventListener('animationend', remove, { once: true });
            overlay.addEventListener('animationcancel', remove, { once: true });
            setTimeout(remove, 600);
        }

        themeToggle.addEventListener('click', () => {
            const isLight = !document.body.classList.contains('light-theme');
            setThemeUI(isLight);
            startThemeTransition();
        });
    </script>

    <!-- 登录区域 - 扁平布局，动态文字动画 -->
    <div class="login-container">
        <!-- 品牌标识 - 动态文字替换了原来的图标 -->
        <div class="brand">
            <span class="dash"></span>
            <span class="dynamic-word" id="brandWords">
                <span>SECURE</span>
                <span>ENCRYPT</span>
            </span>
            <span class="dash"></span>
        </div>

        <!-- 标题 -->
        <div class="login-title">
            <h1>SYH-CR</h1>
            <span class="divider"></span>
            <p>syh's chatter · 登录</p>
        </div>

        <!-- 表单 -->
        <div class="login-form-area">
            <form action="{{ base_path }}/chatts" method="POST" autocomplete="off" id="loginForm">
                <div class="form-control">
                    <input type="text" required name="username" id="username" placeholder=" " autocomplete="off">
                    <label for="username">Username</label>
                </div>
                <div class="form-control">
                    <input type="password" required name="password" id="password" placeholder=" " autocomplete="off">
                    <label for="password">Password</label>
                </div>

            </form>

            <!-- 底部装饰 -->
            <div class="footer-note">
                <span>end-to-end</span>
                <span class="dot-sep"></span>
                <span>encrypted</span>

                <div style="margin-top: 1.5rem; font-size: 0.8rem; letter-spacing: 1px;">
                    <a href="{{ base_path }}/register" style="color: var(--fg-muted); text-decoration: none; border-bottom: 1px solid var(--border-color); padding-bottom: 2px; transition: color 0.2s;">
                        没有账号？立即注册
                    </a>
                </div>

                {% if registered %}
                    <br>
                    <div style="color: var(--fg-secondary); margin-bottom: 1rem;">注册成功，请登录</div>
                {% endif %}
            </div>
        </div>

        <!-- 登录失败就地提示（取代跳转到 /error 页） -->
        <div class="login-error" id="loginError" role="alert" aria-live="assertive">
            <div class="error-animation-text">LOCKED</div>
            <div class="error-message">
                <span class="highlight" id="loginErrorTitle">密码错误</span>，请重新登录。
            </div>
            <div class="error-hint" id="loginErrorHint">如果忘记了密码，请联系管理员</div>
        </div>
    </div>

    <!-- 登录尝试动画舞台：装饰性内容，供读屏的文本见 .auth-live -->
    <div class="auth-stage" id="authStage" aria-hidden="true">
        <div class="auth-hud" id="authHud">
            <!-- 顶部框架行 -->
            <div class="auth-hud-row">
                <span class="auth-hud-bracket">[</span>
                <span>argv_login·syh-cr</span>
                <span class="auth-hud-sep">|</span>
                <span class="auth-hud-stage" id="authHudStage">BOOT</span>
                <span class="auth-hud-track"><i class="auth-hud-track-fill" id="authTrackFill"></i></span>
                <span class="auth-hud-clock" id="authHudClock">00:00.0</span>
                <span class="auth-hud-bracket">]</span>
            </div>

            <!-- 主体：长方形格子窗口 + 右侧状态列表 -->
            <div class="auth-hud-body">
                <div class="auth-frame-wrap">
                    <div class="auth-frame" id="authFrame">
                        <div class="auth-tiles" id="authTiles"></div>
                    </div>
                    <!-- 状态条与中间面板放在长方形包裹层内：边界按长方形宽度算，
                         且不受 .auth-frame 的 overflow:hidden 裁切 -->
                    <div class="auth-bar auth-bar-l" id="authBarL"></div>
                    <div class="auth-bar auth-bar-r" id="authBarR"></div>
                    <div class="auth-center" id="authCenter">
                        <span class="auth-center-text" id="authCenterText"></span>
                    </div>
                </div>
                <div class="auth-hud-side" id="authSide">
                    <span class="auth-hud-item" data-k="load">load</span>
                    <span class="auth-hud-item" data-k="verify">verify</span>
                    <span class="auth-hud-item" data-k="sync">sync</span>
                    <span class="auth-hud-item" data-k="render">render</span>
                    <span class="auth-hud-item" data-k="commit">commit</span>
                </div>
            </div>

            <!-- 底部框架行：计数 + 进度条 + 提示 -->
            <div class="auth-hud-row">
                <span class="auth-hud-count" id="authHudCount">cells 000/000 · 0%</span>
                <span class="auth-progress"><i class="auth-progress-fill" id="authProgressFill"></i></span>
                <span class="auth-hud-prompt" id="authHudPrompt">&gt;_</span>
            </div>
        </div>
    </div>
    <p class="auth-live" id="authLive" role="status" aria-live="polite"></p>

    <!-- 页面配置（挂载前缀等），见 _base_path 注入约定 -->
    <script>
        window.LOGIN_CONFIG = {
            base_path: {{ base_path|tojson }}
        };
    </script>

    <!-- ========== 登录（fetch 提交 + 无刷新换档） ========== -->
    <script>
        (function () {
            'use strict';

            var BASE_PATH = (window.LOGIN_CONFIG && window.LOGIN_CONFIG.base_path) || '';

            var form = document.getElementById('loginForm');
            var submitBtn = document.getElementById('loginSubmit');
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');
            var errorBox = document.getElementById('loginError');
            var errorTitle = document.getElementById('loginErrorTitle');
            var errorHint = document.getElementById('loginErrorHint');
            var brandWords = document.getElementById('brandWords');
            var DEFAULT_SUBMIT_TEXT = submitBtn.textContent;

            var stage = document.getElementById('authStage');
            var tilesBox = document.getElementById('authTiles');
            var centerText = document.getElementById('authCenterText');
            var liveRegion = document.getElementById('authLive');
            var hudStage = document.getElementById('authHudStage');
            var hudClock = document.getElementById('authHudClock');
            var hudCount = document.getElementById('authHudCount');
            var hudPrompt = document.getElementById('authHudPrompt');
            var trackFill = document.getElementById('authTrackFill');
            var progressFill = document.getElementById('authProgressFill');
            var sideItems = document.getElementById('authSide')
                ? document.getElementById('authSide').querySelectorAll('.auth-hud-item')
                : [];

            // 正常品牌词与故障品牌词（失败时整体切换，与 login_error.html 视觉一致）
            var NORMAL_WORDS = ['SECURE', 'ENCRYPT'];
            var ERROR_WORDS = ['DENIED', 'BLOCKED'];

            // ---- 动画时序（毫秒）----
            var T = {
                cell: 34,        // 格子边长（不含间隙）
                gap: 4,          // 格子间隙，与 --auth-tile-gap 保持一致
                tileIn: 280,     // 单格淡入
                tileOut: 240,    // 单格消失
                // 每层对角线的错峰。取值决定「依次出现」是否看得见：
                // 对角层数约 = max(rows,cols)，错峰过小（如 5ms）整场铺满不到
                // 100ms，肉眼只会看到所有格子同时出现。
                stepIn: 30,
                stepOut: 18,
                frame: 450,      // 长方形缩放展开
                fade: 240,       // 舞台淡入
                color: 300,      // 结果换色
                split: 500,      // 状态条拉开
                morph: 450,      // 终态过渡
                minRun: 1150,    // 结果回来后至少停留这么久再变色
                // 状态条拉到位后的停留：失败时结果页会盖住舞台，若不留停留时间，
                // 「拉到位」这一帧还没被看到就被 ACCESS DENIED / LOCKED 盖掉
                dwellFail: 900,
                dwellOk: 380
            };

            var STATUS_TEXT = {
                ok: 'ACCESS GRANTED',
                fail: 'ACCESS DENIED',
                net: 'CONNECTION LOST'
            };

            var reducedMotion = !!(window.matchMedia
                && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

            var submitting = false;
            var tilesBuilt = false;
            var tileDiagSpan = 1;   // 对角层数，用于精确推算消格总时长
            var tileTotal = 0;      // 格子总数，供 HUD 计数
            var tileGroups = [];    // 按对角层分组的格子，供高亮前沿带
            var clockIv = null;

            // ---- HUD 辅助 ----

            function pad(n, w) {
                var s = String(n);
                while (s.length < w) s = '0' + s;
                return s;
            }

            // 顶部阶段词 + 右侧状态列表逐条点亮
            var STAGES = {
                boot: 'BOOT',
                load: 'LOAD',
                verify: 'VERIFY',
                commit: 'COMMIT',
                granted: 'GRANTED',
                denied: 'DENIED',
                lost: 'LOST'
            };

            function setHudStage(name, litCount) {
                hudStage.textContent = STAGES[name] || String(name).toUpperCase();
                for (var i = 0; i < sideItems.length; i++) {
                    var lit = i < litCount;
                    sideItems[i].classList.toggle('lit', lit);
                    sideItems[i].classList.toggle('active', i === litCount - 1 && lit);
                }
            }

            function setHudProgress(filled, total) {
                var pct = total ? Math.round(filled / total * 100) : 0;
                hudCount.textContent = 'cells ' + pad(filled, 3) + '/' + pad(total, 3)
                    + ' · ' + pct + '%';
                var w = pct + '%';
                progressFill.style.width = w;
                trackFill.style.width = w;
            }

            function setHudPrompt(text) {
                hudPrompt.textContent = '> ' + text;
            }

            function startClock() {
                var t0 = Date.now();
                stopClock();
                clockIv = setInterval(function () {
                    var s = (Date.now() - t0) / 1000;
                    hudClock.textContent = '00:' + pad(s < 10 ? '0' + s.toFixed(1) : s.toFixed(1), 4);
                }, 100);
            }

            function stopClock() {
                if (clockIv) { clearInterval(clockIv); clockIv = null; }
            }

            // 高亮正在铺开的那条对角前沿带
            function setFrontier(diag) {
                if (diag < 0 || diag >= tileGroups.length) return;
                for (var d = 0; d < tileGroups.length; d++) {
                    var on = (d === diag);
                    var g = tileGroups[d];
                    for (var i = 0; i < g.length; i++) {
                        if (g[i].classList.contains('frontier') !== on) {
                            g[i].classList.toggle('frontier', on);
                        }
                    }
                }
            }

            function wait(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            // 依长方形实际布局尺寸建自适应网格；delay 按「距右上角的切比雪夫距离」
            // 递增，形成自右上角扩散的对角带。
            // 注意：必须用 offsetWidth/Height（布局尺寸）而非 getBoundingClientRect，
            // 后者含 scale 变换值，长方形尚在缩放中时会算出一张过小的网格。
            function buildTiles() {
                if (tilesBuilt) return;
                var frame = document.getElementById('authFrame');
                var frameW = frame.offsetWidth;
                var frameH = frame.offsetHeight;
                if (!frameW || !frameH) {
                    // 极端情况（舞台未参与布局）退回视口估算
                    frameW = Math.min(440, window.innerWidth * 0.82);
                    frameH = 232;
                }

                var cols = Math.max(1, Math.round((frameW + T.gap) / (T.cell + T.gap)));
                var rows = Math.max(1, Math.round((frameH + T.gap) / (T.cell + T.gap)));
                tileDiagSpan = Math.max(rows - 1, cols - 1) + 1;
                // 标号字号按实际格宽收窄：格子有 overflow:hidden，字号固定时
                // 「R11·C11」在窄格子里会被裁掉，等于没有编号
                var cellW = (frameW - (cols - 1) * T.gap) / cols;
                var labelFs = Math.max(4.5, Math.min(9, cellW / 4.4)).toFixed(2);
                var html = '';

                for (var r = 0; r < rows; r++) {
                    for (var c = 0; c < cols; c++) {
                        // 到左上角的切比雪夫距离：diag=0 即左上角那一格
                        var diag = Math.max(r, c);
                        var dIn = diag * T.stepIn;
                        var dOut = diag * T.stepOut;
                        var label = 'R' + (r + 1) + '·C' + (c + 1);
                        html += '<div class="auth-tile" data-diag="' + diag
                            + '" style="transition-delay:'
                            + dIn + 'ms,' + dIn + 'ms,' + dOut + 'ms">'
                            + '<span class="auth-tile-label" title="' + label
                            + '" style="font-size:' + labelFs + 'px">' + label + '</span>'
                            + '</div>';
                    }
                }
                tilesBox.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
                tilesBox.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
                tilesBox.style.gap = T.gap + 'px';
                tilesBox.innerHTML = html;
                // 按对角层分组，供高亮前沿带
                tileGroups = [];
                for (var d = 0; d < tileDiagSpan; d++) tileGroups.push([]);
                var kids = tilesBox.children;
                for (var n = 0; n < kids.length; n++) {
                    var idx = kids[n].getAttribute('data-diag');
                    tileGroups[parseInt(idx, 10)].push(kids[n]);
                }
                tileTotal = cols * rows;
                setHudProgress(0, tileTotal);
                tilesBuilt = true;
            }

            function setBrandWords(words, isError) {
                var spans = brandWords.querySelectorAll('span');
                for (var i = 0; i < spans.length; i++) {
                    // 仅写入固定常量，不拼接任何服务端数据
                    spans[i].textContent = words[i] || '';
                }
                brandWords.classList.toggle('is-error', !!isError);
            }

            function showError(title, hint) {
                errorTitle.textContent = title;
                errorHint.textContent = hint;
                setBrandWords(ERROR_WORDS, true);
                errorBox.classList.add('active');
            }

            function clearError() {
                errorBox.classList.remove('active');
                setBrandWords(NORMAL_WORDS, false);
            }

            function setSubmitting(flag) {
                submitting = flag;
                submitBtn.disabled = flag;
                submitBtn.textContent = flag ? '// 验证中 //' : DEFAULT_SUBMIT_TEXT;
            }

            // 淡出登录区内容（长方形出现的同时）
            function hideFormArea() {
                var area = document.querySelector('.login-form-area');
                var brand = document.querySelector('.brand');
                var title = document.querySelector('.login-title');
                [area, brand, title].forEach(function (el) {
                    if (!el) return;
                    el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0.97)';
                });
            }

            function restoreFormArea() {
                var area = document.querySelector('.login-form-area');
                var brand = document.querySelector('.brand');
                var title = document.querySelector('.login-title');
                [area, brand, title].forEach(function (el) {
                    if (!el) return;
                    el.style.opacity = '';
                    el.style.transform = '';
                });
            }

            // 换档时注入：把长方形终态精确落到真实 #chat 的矩形上。
            // document.open() 会销毁本页 JS 上下文，此处只能把代码以字符串形式
            // 注入目标页 —— 时长与配色在此内联为字面量。
            function buildMorphInject(token) {
                return '<style id="auth-morph-style">'
                    + '#auth-morph-stage{position:fixed;inset:0;z-index:10001;'
                    + 'pointer-events:none;overflow:hidden}'
                    + '#auth-morph-center{position:absolute;background:var(--bg-primary);'
                    + 'transform-origin:center center;transition:none}'
                    + '@media (prefers-reduced-motion: reduce){ #auth-morph-center{transition:none}}'
                    + '</style>'
                    + '<div id="auth-morph-stage" aria-hidden="true">'
                    + '<div id="auth-morph-center"></div></div>'
                    + '<script>(function(){var d=document.getElementById("auth-morph-center");'
                    + 'var s=document.getElementById("auth-morph-stage");'
                    + 'function place(sel,anim){var t=document.querySelector(sel);'
                    + 'if(!t){return false;}var r=t.getBoundingClientRect();'
                    + 'if(!r.width||!r.height){return false;}'
                    // 记录落位依据的矩形，便于验证「精确落到 #chat 的矩形」
                    + 'window.__AUTH_MORPH_FROM={l:Math.round(r.left),t:Math.round(r.top),'
                    + 'w:Math.round(r.width),h:Math.round(r.height),sel:sel};'
                    + 'd.style.transition="none";'
                    + 'd.style.left=r.left+"px";d.style.top=r.top+"px";'
                    + 'd.style.width=r.width+"px";d.style.height=r.height+"px";'
                    + 'void d.offsetWidth;'
                    + 'd.style.transition=anim;return true;}'
                    + 'function run(){'
                    // #chat 自带 fadeInUp 入场（含 translateY），测量前先摘掉，
                    // 否则量到的是动画中间态的矩形（与 chat.js 主题切换同一做法）
                    + 'var c=document.getElementById("chat");'
                    + 'if(c){c.style.animation="none";}'
                    + 'void document.body.offsetWidth;'
                    + 'var ok=place("#chat","all ' + T.morph + 'ms ease");'
                    + 'if(!ok){ok=place("#body","all ' + T.morph + 'ms ease");}'
                    + 'if(ok){setTimeout(function(){s.remove();},'+ T.morph + '+60);}'
                    + 'else{s.remove();}}'
                    + 'if(document.readyState==="loading"){'
                    + 'document.addEventListener("DOMContentLoaded",run);}else{run();}'
                    + '})();<\/script>';
            }

            // 无刷新换档：fetch 目标页 HTML → 整档替换并同步地址栏。
            // document.open() 会重置文档并重建全局作用域，因此 chat.js 顶层的
            // const BASE_PATH 可正常重新声明；document.close() 结束解析后同样会
            // 重新触发 DOMContentLoaded，chat.js 的初始化照常执行。
            function softNavigate(url, withMorph) {
                return fetch(url, { credentials: 'same-origin' }).then(function (response) {
                    // 被重定向（会话失效等）或返回非 200 时放弃换档，走整页跳转兜底
                    if (response.redirected || !response.ok) {
                        window.location.assign(BASE_PATH + '/');
                        return null;
                    }
                    return response.text();
                }).then(function (html) {
                    if (html === null) return;
                    if (withMorph) {
                        html = html.replace('</body>', buildMorphInject(url) + '</body>');
                    }

                    var reduced = reducedMotion;
                    var delay = reduced ? 0 : 180;

                    setTimeout(function () {
                        // replaceState 而非 pushState：document.write 已不可逆地替换了
                        // 本文档，pushState 会让浏览器后退时去恢复一个不存在的登录页。
                        history.replaceState(null, '', url);
                        document.open();
                        document.write(html);
                        document.close();
                    }, delay);
                });
            }

            // 阶段 A（装载）：点击即刻开始铺格子，不等服务器返回
            function beginFill() {
                stage.classList.add('active');
                hideFormArea();
                void stage.offsetWidth;   // 强制回流，让缩放过渡从 0 起播
                buildTiles();
                // 关键：插入格子后必须再回流一次，把 opacity:0 的初始态刷出来。
                // 否则「建格子」与「加 is-filling」落在同一帧，浏览器首次样式计算
                // 就已是 opacity:1，过渡不会发生——表现为所有格子同时出现。
                void tilesBox.offsetWidth;
                stage.classList.add('is-filling');
                liveRegion.textContent = '正在验证';
                setHudStage('load', 1);
                setHudPrompt('load cells');
                startClock();
                // 前沿带跟随对角错峰推进，计数与进度条同步
                var total = tileDiagSpan;
                var t0 = Date.now();
                var lastDiag = -1;
                var iv = setInterval(function () {
                    if (!stage.classList.contains('active')) { clearInterval(iv); return; }
                    var diag = Math.min(total - 1,
                        Math.floor((Date.now() - t0) / T.stepIn));
                    if (diag === lastDiag) return;
                    setFrontier(diag);
                    // 已铺开 = 对角层 0..diag 的格子数
                    var filled = 0;
                    for (var d = 0; d <= diag && d < total; d++) filled += tileGroups[d].length;
                    setHudProgress(filled, tileTotal);
                    lastDiag = diag;
                }, 30);
            }

            // 阶段 B~E：结果 → 消格 → 状态条拉开 → 终态
            // started 为点击时刻；即使结果早已回来也至少展示 minRun 再变色。
            function playAttempt(result, started) {
                var ok = result.kind === 'ok';

                function doneA() {
                    // 结果：格子与轮廓切绿/红
                    stopClock();
                    setFrontier(-1);
                    stage.classList.add(ok ? 'is-ok' : 'is-fail');
                    centerText.textContent = STATUS_TEXT[result.kind] || STATUS_TEXT.fail;
                    liveRegion.textContent = ok ? '验证通过' : '验证失败';
                    setHudProgress(tileTotal, tileTotal);
                    setHudStage('verify', 2);
                    setHudPrompt(ok ? 'verify ok' : 'verify failed');
                    return wait(T.color);
                }

                function stageC() {
                    stage.classList.remove('is-filling');
                    stage.classList.add('is-clearing');
                    setHudPrompt('clear cells');
                    // 最后一层格子的 delay + 单格消失时长
                    return wait(T.tileOut + (tileDiagSpan - 1) * T.stepOut + 60);
                }

                function stageD() {
                    stage.classList.add('is-split');
                    setHudStage(ok ? 'granted' : 'denied', 5);
                    setHudPrompt(ok ? 'open session' : 'reject');
                    // 拉到位后先停留，再进入终态，否则收尾动画会在到位瞬间就盖上来
                    return wait(T.split + (ok ? T.dwellOk : T.dwellFail));
                }

                function stageE() {
                    stopClock();
                    if (ok) {
                        // 成功：竖条继续移出，中间面板交给注入脚本过渡到 #chat
                        setHudStage('commit', 5);
                        stage.classList.add('is-leaving');
                        return wait(T.morph).then(function () {
                            return softNavigate(
                                BASE_PATH + '/chatts?update=' + encodeURIComponent(result.token), true
                            );
                        });
                    }
                    // 失败：状态条淡出，还原表单并弹出 LOCKED
                    stage.classList.remove('active');
                    stage.classList.remove('is-split', 'is-filling', 'is-clearing',
                        'is-ok', 'is-fail', 'is-leaving');
                    tilesBuilt = false;
                    tileGroups = [];
                    tilesBox.innerHTML = '';
                    restoreFormArea();
                    setSubmitting(false);
                    setHudStage('boot', 0);
                    setHudProgress(0, 0);
                    if (result.kind === 'net') {
                        showError('连接失败', '无法连接到服务器，请检查网络');
                    } else {
                        showError('密码错误', '如果忘记了密码，请联系管理员');
                    }
                    passwordInput.value = '';
                    passwordInput.focus();
                }

                return wait(Math.max(0, T.minRun - (Date.now() - started)))
                    .then(doneA)
                    .then(stageC)
                    .then(stageD)
                    .then(stageE);
            }

            form.addEventListener('submit', function (event) {
                // JS 可用时走 fetch；脚本未加载/被禁用时表单仍可原生 POST 到
                // /chatts，由服务端按原逻辑 302 到 /error 兜底。
                if (typeof window.fetch !== 'function') return;
                event.preventDefault();
                if (submitting) return;

                var username = (usernameInput.value || '').trim();
                var password = passwordInput.value || '';
                if (!username || !password) return;

                clearError();
                setSubmitting(true);
                var started = Date.now();

                // 动画与请求并行：点击即刻铺格子，服务器慢时界面也有反馈
                if (!reducedMotion) beginFill();

                var loginPromise = fetch(BASE_PATH + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                }).then(function (response) {
                    return response.json().then(function (data) {
                        return { ok: response.ok && !!data.ok, data: data };
                    }).catch(function () {
                        return { ok: false, data: {} };
                    });
                }).then(function (res) {
                    if (res.ok && res.data.update) {
                        return { kind: 'ok', token: res.data.update };
                    }
                    return { kind: 'fail' };
                }).catch(function () {
                    return { kind: 'net' };
                });

                if (reducedMotion) {
                    // 降级：不放动画，直接按结果换档或就地报错
                    loginPromise.then(function (result) {
                        if (result.kind === 'ok') {
                            softNavigate(
                                BASE_PATH + '/chatts?update=' + encodeURIComponent(result.token), false
                            );
                            return;
                        }
                        setSubmitting(false);
                        if (result.kind === 'net') {
                            showError('连接失败', '无法连接到服务器，请检查网络');
                        } else {
                            showError('密码错误', '如果忘记了密码，请联系管理员');
                        }
                        passwordInput.value = '';
                        passwordInput.focus();
                    });
                    return;
                }

                loginPromise.then(function (result) {
                    return playAttempt(result, started);
                });
            });

            // 重新输入时收起故障覆盖层
            form.addEventListener('input', function () {
                if (errorBox.classList.contains('active') && !submitting) clearError();
            });
        })();
    </script>
</body>
</html>
